    <style>
        .changelog-container { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
        .back-link { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem; font-weight: 500; font-size: 0.85rem; opacity: 0.8; }
        .back-link:hover { opacity: 1; }

        /* Header */
        .changelog-header { margin-bottom: 1.5rem; }
        .changelog-header h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
        .changelog-header p { margin: 0; color: var(--text-muted); font-size: 0.85rem; }

        /* Summary stats */
        .changelog-summary { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; }
        .summary-stat { text-align: center; }
        .summary-stat .num { font-size: 1.25rem; font-weight: 800; color: var(--primary); font-family: var(--font-mono); }
        .summary-stat .label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }

        /* Filter controls */
        .changelog-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem; }
        .changelog-search { flex: 1; min-width: 180px; padding: 0.5rem 0.75rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 0.8rem; font-family: inherit; outline: none; transition: border-color 0.2s; }
        .changelog-search:focus { border-color: var(--primary); }
        .changelog-search::placeholder { color: var(--text-muted); }
        .filter-chips { display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .filter-chip { padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.15s; user-select: none; }
        .filter-chip:hover { border-color: var(--primary); color: var(--primary); }
        .filter-chip.active { background: var(--primary); color: var(--bg); border-color: var(--primary); }

        /* Version groups */
        .version-group { margin-bottom: 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: all 0.2s; }
        .version-group.collapsed .version-entries { display: none; }
        .version-header { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; cursor: pointer; user-select: none; transition: background 0.15s; }
        .version-header:hover { background: rgba(255,255,255,0.03); }
        .version-badge { background: var(--primary); color: var(--bg); font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; font-family: var(--font-mono); white-space: nowrap; }
        .version-title { flex: 1; font-size: 0.82rem; font-weight: 600; color: var(--text); }
        .version-date { font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-mono); }
        .version-chevron { color: var(--text-muted); transition: transform 0.2s; width: 16px; height: 16px; }
        .version-group.collapsed .version-chevron { transform: rotate(-90deg); }
        .version-pr { font-size: 0.65rem; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 0.1rem 0.4rem; border-radius: 3px; font-family: var(--font-mono); }
        .version-count { font-size: 0.6rem; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 0.15rem 0.4rem; border-radius: 10px; }

        /* Entries */
        .version-entries { border-top: 1px solid var(--border); }
        .version-description { padding: 0.5rem 1rem; font-size: 0.75rem; color: var(--text-muted); font-style: italic; border-bottom: 1px solid var(--border); }
        .changelog-entry { display: flex; gap: 0.6rem; padding: 0.55rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.03); align-items: flex-start; transition: background 0.1s; }
        .changelog-entry:last-child { border-bottom: none; }
        .changelog-entry:hover { background: rgba(255,255,255,0.02); }
        .changelog-tag { font-size: 0.55rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.15rem 0.4rem; border-radius: 4px; flex-shrink: 0; margin-top: 0.15rem; white-space: nowrap; }
        .tag-feature { background: rgba(245,197,24,0.12); color: var(--primary); }
        .tag-fix { background: rgba(52,211,153,0.12); color: var(--success, #34d399); }
        .tag-design { background: rgba(129,140,248,0.12); color: #818cf8; }
        .tag-infra { background: rgba(148,163,184,0.12); color: var(--text-dim); }
        .tag-docs { background: rgba(14,165,233,0.12); color: #0ea5e9; }
        .tag-security { background: rgba(248,113,113,0.12); color: #f87171; }
        .tag-a11y { background: rgba(168,85,247,0.12); color: #a855f7; }
        .changelog-text { font-size: 0.78rem; color: var(--text-dim); line-height: 1.5; }

        /* Empty state */
        .changelog-empty { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem; }

        /* Responsive */
        @media (max-width: 600px) {
            .changelog-summary { gap: 1rem; justify-content: center; }
            .changelog-controls { flex-direction: column; }
            .changelog-search { width: 100%; }
            .filter-chips { width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 0.25rem; }
            .version-header { padding: 0.7rem 0.75rem; gap: 0.5rem; }
            .changelog-entry { padding: 0.45rem 0.75rem; }
            .version-title { font-size: 0.75rem; }
        }
    </style>
</head>

            document.getElementById('changelog-summary').innerHTML = `
                <div class="changelog-summary">
                    <div class="summary-stat"><div class="num">${releases.length}</div><div class="label">Releases</div></div>
                    <div class="summary-stat"><div class="num">${counts.total}</div><div class="label">Changes</div></div>

                    <div class="summary-stat"><div class="num">${counts.fix}</div><div class="label">Fixes</div></div>
                    <div class="summary-stat"><div class="num">${counts.infra}</div><div class="label">Infra</div></div>
                </div>`;

        function renderControls() {
            const filters = ['all', 'feature', 'fix', 'design', 'a11y', 'infra', 'docs', 'security'];

                <div class="changelog-controls">
                    <input type="text" class="changelog-search" placeholder="Search changes..." id="search-input" value="${searchQuery}">
                    <div class="filter-chips">
                        ${filters.map(f => `<button class="filter-chip ${activeFilter === f ? 'active' : ''}" data-filter="${f}">${f}</button>`).join('')}
                    </div>
                </div>`;

            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderContent();
            });

            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    activeFilter = chip.dataset.filter;
                    renderControls();
                    renderContent();
                });
            });
        }

        function renderContent() {
            const container = document.getElementById('changelog-content');
            let html = '';
            let visibleReleases = 0;

            for (const release of releases) {
                let filteredEntries = release.entries;

                // Apply tag filter
                if (activeFilter !== 'all') {
                    filteredEntries = filteredEntries.filter(e => e.tag === activeFilter);
                }

                // Apply search
                if (searchQuery) {
                    filteredEntries = filteredEntries.filter(e =>
                        e.text.toLowerCase().includes(searchQuery) ||
                        e.tag.toLowerCase().includes(searchQuery)
                    );
                }

                if (filteredEntries.length === 0) continue;
                visibleReleases++;

                const isCollapsed = collapsedVersions.has(release.version);
                const prBadge = release.pr ? `<span class="version-pr">${release.pr}</span>` : '';

                html += `<div class="version-group ${isCollapsed ? 'collapsed' : ''}" data-version="${release.version}">`;
                html += `<div class="version-header" data-version="${release.version}">
                    <span class="version-badge">${release.version}</span>
                    <span class="version-title">${release.description}</span>
                    ${prBadge}
                    <span class="version-count">${filteredEntries.length}</span>
                    <span class="version-date">${formatDate(release.date)}</span>
                    <svg class="version-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>`;
                html += `<div class="version-entries">`;

                for (const entry of filteredEntries) {
                    const cfg = tagConfig[entry.tag] || tagConfig.infra;
                    html += `<div class="changelog-entry">
                        <span class="changelog-tag ${cfg.cls}">${cfg.label}</span>
                        <div class="changelog-text">${highlightSearch(entry.text)}</div>
                    </div>`;
                }

                html += '</div></div>';
            }

            if (visibleReleases === 0) {
                html = '<div class="changelog-empty">No changes match your filter.</div>';
            }

            container.innerHTML = html;

            // Bind collapse/expand
            document.querySelectorAll('.version-header').forEach(header => {
                header.addEventListener('click', () => {
                    const version = header.dataset.version;
                    if (collapsedVersions.has(version)) {
                        collapsedVersions.delete(version);
                    } else {
                        collapsedVersions.add(version);
                    }
                    renderContent();
                });
            });
        }

        function highlightSearch(text) {
            if (!searchQuery) return text;
            const regex = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<mark style="background:rgba(245,197,24,0.25);color:inherit;border-radius:2px;padding:0 2px">$1</mark>');
        }

        // Initial render
        renderSummary();
        renderControls();
        renderContent();
    </script>
    <script src="config.js"></script>
    <script src="consent.js"></script>
    <script src="auth.js"></script>
    <script src="nav.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
