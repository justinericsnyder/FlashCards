<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certification Tracker — Good Better Best</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script><script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ---- Fluent 2 design tokens (light) — scoped to this page ---- */
        .cert-page {
            /* Surfaces, text, brand & success derive from the active app theme (theme.js) */
            --f-canvas: var(--bg-body);
            --f-surface: var(--bg-card);
            --f-surface-2: color-mix(in srgb, var(--text) 7%, var(--bg-card));
            --f-stroke: var(--border);
            --f-stroke-2: color-mix(in srgb, var(--text) 16%, var(--border));
            --f-text: var(--text);
            --f-text-2: var(--text-dim);
            --f-text-3: var(--text-muted);
            --f-brand: var(--primary);
            /* Category accents are intrinsic to the certification poster — kept across themes */
            --f-brand-cloud: #0078d4;
            --f-brand-aibiz: #c239b3;
            --f-brand-security: #498205;
            --f-github: #6e40c9;
            --f-success: var(--success, #34d399);
            --f-success-bg: color-mix(in srgb, var(--success, #34d399) 13%, var(--bg-card));
            --f-success-stroke: color-mix(in srgb, var(--success, #34d399) 45%, var(--border));
            --f-radius: 4px;
            --f-radius-lg: 8px;
            --f-shadow-2: 0 1px 2px rgba(0,0,0,.10), 0 0 1px rgba(0,0,0,.10);
            --f-shadow-4: 0 2px 4px rgba(0,0,0,.12), 0 0 2px rgba(0,0,0,.10);
            --f-shadow-8: 0 4px 8px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
            --f-font: 'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'DM Sans',sans-serif;

            font-family: var(--f-font);
            background: var(--f-canvas);
            color: var(--f-text);
            min-height: 100vh;
            box-sizing: border-box;
            padding: 1.75rem 2rem 4rem;
            max-width: 1320px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }
        .cert-page *, .cert-page *::before, .cert-page *::after { box-sizing: border-box; }

        .cert-page .back-link {
            color: var(--f-brand); text-decoration: none; display: inline-flex; align-items: center;
            gap: 0.35rem; margin-bottom: 1rem; font-weight: 600; font-size: 0.82rem;
        }
        .cert-page .back-link:hover { text-decoration: underline; }

        /* ---- Header ---- */
        .cert-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .cert-head h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 0.25rem; line-height: 1.1; }
        .cert-head h1 .accent {
            background: linear-gradient(90deg,#0078d4,#c239b3,#498205);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .cert-head p { color: var(--f-text-2); font-size: 0.9rem; margin: 0; max-width: 46ch; }
        .cert-head .head-links { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .cert-head .head-links a, .cert-page .ghost-btn {
            font-size: 0.78rem; font-weight: 600; color: var(--f-text-2); text-decoration: none;
            border: 1px solid var(--f-stroke-2); background: var(--f-surface); padding: 0.4rem 0.7rem;
            border-radius: var(--f-radius); display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer;
            transition: background .1s, border-color .1s;
        }
        .cert-head .head-links a:hover, .cert-page .ghost-btn:hover { background: var(--f-surface-2); border-color: var(--f-text-3); }
        .cert-page .ghost-btn.danger:hover { color: #b10e1c; border-color: #b10e1c; }

        /* ---- Top metrics ---- */
        .metrics { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
        .metric-card {
            background: var(--f-surface); border: 1px solid var(--f-stroke); border-radius: var(--f-radius-lg);
            padding: 0.9rem 1rem; box-shadow: var(--f-shadow-2);
        }
        .metric-card .m-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--f-text-3); font-weight: 600; display: flex; align-items: center; gap: 0.35rem; }
        .metric-card .m-value { font-size: 1.7rem; font-weight: 700; margin-top: 0.15rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .metric-card .m-sub { font-size: 0.72rem; color: var(--f-text-2); margin-top: 0.15rem; }
        .metric-card .m-icon { width: 14px; height: 14px; }

        .overall { display: flex; flex-direction: column; justify-content: center; }
        .overall .m-top { display: flex; align-items: baseline; gap: 0.5rem; }
        .overall .pct { font-size: 2.1rem; font-weight: 700; color: var(--f-brand); line-height: 1; font-variant-numeric: tabular-nums; }
        .overall .frac { font-size: 0.85rem; color: var(--f-text-2); }
        .progress-track { height: 8px; background: var(--f-surface-2); border-radius: 99px; margin-top: 0.6rem; overflow: hidden; border: 1px solid var(--f-stroke); }
        .progress-fill { height: 100%; background: linear-gradient(90deg,#0078d4,#c239b3,#498205); border-radius: 99px; transition: width .5s cubic-bezier(.2,.9,.3,1); }

        /* ---- Toolbar ---- */
        .toolbar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .toolbar .search { position: relative; flex: 1; min-width: 200px; max-width: 380px; }
        .toolbar .search input {
            width: 100%; padding: 0.5rem 0.7rem 0.5rem 2rem; border: 1px solid var(--f-stroke-2);
            border-radius: var(--f-radius); font-size: 0.85rem; font-family: var(--f-font); background: var(--f-surface); color: var(--f-text);
        }
        .toolbar .search input:focus { outline: none; border-color: var(--f-brand); box-shadow: 0 0 0 1px var(--f-brand); }
        .toolbar .search .s-icon { position: absolute; left: 0.55rem; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--f-text-3); }
        .toggle { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--f-text-2); cursor: pointer; user-select: none; font-weight: 600; }
        .toggle input { accent-color: var(--f-brand); width: 15px; height: 15px; }
        .legend { display: flex; gap: 0.9rem; flex-wrap: wrap; margin-left: auto; font-size: 0.72rem; color: var(--f-text-2); }
        .legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
        .legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

        /* ---- Level filter chips ---- */
        .lvl-filters { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
        .lvl-filters .lf-label { font-size: 0.7rem; font-weight: 700; color: var(--f-text-3); text-transform: uppercase; letter-spacing: 0.06em; }
        .lvl-chip {
            font-family: var(--f-font); font-size: 0.78rem; font-weight: 600; color: var(--f-text-2);
            background: var(--f-surface); border: 1px solid var(--f-stroke-2); border-radius: 99px;
            padding: 0.32rem 0.72rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
            transition: all .12s; user-select: none;
        }
        .lvl-chip:hover { border-color: var(--f-brand); color: var(--f-text); }
        .lvl-chip:not(.active) { opacity: 0.5; }
        .lvl-chip.active { background: color-mix(in srgb, var(--f-brand) 15%, var(--f-surface)); border-color: var(--f-brand); color: var(--f-brand); }
        .lvl-chip .lf-check { width: 12px; height: 12px; }
        .lvl-chip:not(.active) .lf-check { display: none; }
        .lvl-chip .lvl-count { font-family: var(--font-mono, monospace); font-size: 0.66rem; color: var(--f-text-3); font-weight: 700; }
        .lvl-chip.active .lvl-count { color: var(--f-brand); }
        .cols-empty { grid-column: 1 / -1; text-align: center; color: var(--f-text-3); padding: 3rem 1rem; font-size: 0.9rem; }

        /* ---- Columns ---- */
        .columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; align-items: start; }
        .col { background: var(--f-surface); border: 1px solid var(--f-stroke); border-radius: var(--f-radius-lg); box-shadow: var(--f-shadow-2); overflow: hidden; }
        .col-head { padding: 0.9rem 1rem 0.8rem; border-top: 3px solid var(--col-accent, var(--f-brand)); }
        .col-head .ch-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        .col-head h2 { font-size: 0.98rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 0.45rem; }
        .col-head h2 .ch-icon { width: 17px; height: 17px; color: var(--col-accent); }
        .col-head .ch-pct { font-size: 1.05rem; font-weight: 700; color: var(--col-accent); font-variant-numeric: tabular-nums; }
        .col-head .ch-frac { font-size: 0.72rem; color: var(--f-text-3); font-weight: 600; }
        .col-progress { height: 6px; background: var(--f-surface-2); border-radius: 99px; margin-top: 0.55rem; overflow: hidden; }
        .col-progress > div { height: 100%; background: var(--col-accent); border-radius: 99px; transition: width .5s cubic-bezier(.2,.9,.3,1); }

        .level-group { padding: 0.4rem 0.7rem 0.7rem; }
        .level-title { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--f-text-3); padding: 0.6rem 0.3rem 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
        .level-title .lt-count { color: var(--f-text-3); font-weight: 600; margin-left: auto; }

        /* ---- Cert card ---- */
        .cert {
            position: relative; display: flex; flex-direction: column; gap: 0.35rem;
            border: 1px solid var(--f-stroke); border-left: 3px solid var(--f-stroke-2);
            border-radius: var(--f-radius); padding: 0.55rem 0.65rem 0.55rem 0.7rem; margin-bottom: 0.4rem;
            background: var(--f-surface); cursor: pointer; transition: box-shadow .1s, border-color .1s, background .15s, transform .08s;
        }
        .cert:hover { box-shadow: var(--f-shadow-4); border-left-color: var(--col-accent); }
        .cert:active { transform: scale(0.995); }
        .cert .c-main { display: flex; align-items: flex-start; gap: 0.6rem; }
        .cert .c-text { flex: 1; min-width: 0; }
        .cert .c-title { font-size: 0.8rem; font-weight: 600; line-height: 1.25; color: var(--f-text); }
        .cert .c-meta { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.3rem; flex-wrap: wrap; }
        .cert .c-code {
            font-family: var(--font-mono, monospace); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.02em;
            background: var(--f-text); color: var(--f-surface); padding: 0.12rem 0.4rem; border-radius: 3px;
        }
        .cert[data-provider="business"] .c-code { background: var(--f-brand-aibiz); color: #fff; }
        .cert[data-provider="github"] .c-code { background: var(--f-github); color: #fff; }
        .badge { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.1rem 0.32rem; border-radius: 3px; display: inline-flex; align-items: center; gap: 0.2rem; }
        .badge.beta { background: rgba(217,146,10,.16); color: #d9920a; }
        .badge.new { background: rgba(59,130,246,.16); color: #4b91f7; }
        .badge.expert { background: rgba(139,92,246,.16); color: #9b7cf0; }
        .badge.prereq { background: color-mix(in srgb, var(--f-text-3) 22%, transparent); color: var(--f-text-2); }
        .badge.soon { background: color-mix(in srgb, var(--f-text-3) 22%, transparent); color: var(--f-text-2); }
        .badge .b-icon { width: 9px; height: 9px; }

        /* Applied Skills type pill (no exam code) */
        .type-pill { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.12rem 0.42rem; border-radius: 3px; }
        .type-pill.type-tech { background: rgba(0,120,212,.16); color: #2b88d8; }
        .type-pill.type-business { background: color-mix(in srgb, var(--f-brand-aibiz) 18%, transparent); color: var(--f-brand-aibiz); }

        /* Coming-soon Applied Skills — visible but not yet earnable */
        .cert.coming { cursor: default; opacity: 0.72; }
        .cert.coming:hover { box-shadow: none; border-left-color: var(--f-stroke-2); }
        .cert.coming .check { border-style: dashed; cursor: default; }

        /* ---- Per-item status: targeting / awaiting results ---- */
        .c-actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
        .act-btn {
            width: 25px; height: 25px; border-radius: 6px; border: 1px solid var(--f-stroke-2);
            background: var(--f-surface); color: var(--f-text-3); display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: all .12s; padding: 0;
        }
        .act-btn svg { width: 13px; height: 13px; }
        .act-btn:hover { color: var(--f-text); border-color: var(--f-text-3); }
        .act-btn.act-target[aria-pressed="true"] { background: rgba(217,146,10,.18); border-color: #d9920a; color: #d9920a; }
        .act-btn.act-await[aria-pressed="true"]  { background: rgba(139,92,246,.18); border-color: #9b7cf0; color: #9b7cf0; }

        /* Status accents on the whole card for glanceability */
        .cert.targeting { border-left-color: #d9920a; background: color-mix(in srgb, #d9920a 7%, var(--f-surface)); }
        .cert.awaiting  { border-left-color: #9b7cf0; background: color-mix(in srgb, #9b7cf0 8%, var(--f-surface)); }

        .status-pill { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.1rem 0.4rem; border-radius: 3px; display: inline-flex; align-items: center; gap: 0.25rem; }
        .status-pill .b-icon { width: 9px; height: 9px; }
        .status-pill.s-target { background: rgba(217,146,10,.16); color: #d9920a; }
        .status-pill.s-await  { background: rgba(139,92,246,.16); color: #9b7cf0; }

        /* Compact totals strip under the metrics */
        .status-strip { display: flex; gap: 1rem; flex-wrap: wrap; margin: -0.5rem 0 1.25rem; font-size: 0.78rem; font-weight: 600; }
        .status-strip .ss { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--f-text-2); }
        .status-strip .ss svg { width: 14px; height: 14px; }
        .status-strip .ss.s-target svg { color: #d9920a; }
        .status-strip .ss.s-await svg { color: #9b7cf0; }
        .status-strip .ss b { color: var(--f-text); font-variant-numeric: tabular-nums; }

        /* ---- Mode switch (segmented control) ---- */
        .mode-switch { display: inline-flex; gap: 0.25rem; padding: 0.25rem; background: var(--f-surface-2); border: 1px solid var(--f-stroke); border-radius: var(--f-radius-lg); margin-bottom: 1.25rem; }
        .mode-btn {
            font-family: var(--f-font); font-size: 0.85rem; font-weight: 600; color: var(--f-text-2);
            background: transparent; border: none; border-radius: calc(var(--f-radius-lg) - 3px);
            padding: 0.45rem 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: all .12s;
        }
        .mode-btn:hover { color: var(--f-text); }
        .mode-btn.active { background: var(--f-surface); color: var(--f-brand); box-shadow: var(--f-shadow-2); }

        /* check control */
        .check {
            flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid var(--f-stroke-2); background: var(--f-surface);
            display: flex; align-items: center; justify-content: center; transition: all .12s; margin-top: 1px;
        }
        .check svg { width: 13px; height: 13px; color: #fff; opacity: 0; transform: scale(0.5); transition: all .12s; }
        .cert:hover .check { border-color: var(--col-accent); }

        /* completed state — high glance contrast */
        .cert.done {
            background: var(--f-success-bg); border-color: var(--f-success-stroke);
            border-left-color: var(--f-success); animation: pop .25s cubic-bezier(.34,1.56,.64,1);
        }
        .cert.done .check { background: var(--f-success); border-color: var(--f-success); }
        .cert.done .check svg { opacity: 1; transform: scale(1); }
        .cert.done .c-title { color: color-mix(in srgb, var(--f-success) 45%, var(--f-text)); }
        @keyframes pop { 0%{transform:scale(.97)} 60%{transform:scale(1.02)} 100%{transform:scale(1)} }

        .done-foot { display: flex; align-items: center; gap: 0.4rem; padding-left: 1.6rem; }
        .done-foot .df-icon { width: 12px; height: 12px; color: var(--f-success); flex-shrink: 0; }
        .done-foot label { font-size: 0.68rem; color: var(--f-success); font-weight: 700; }
        .done-foot input[type=date] {
            font-family: var(--f-font); font-size: 0.7rem; color: var(--f-text); font-weight: 600;
            border: 1px solid var(--f-success-stroke); background: var(--f-surface); border-radius: 3px; padding: 0.1rem 0.3rem; cursor: pointer;
            color-scheme: light dark;
        }
        .done-foot input[type=date]:focus { outline: none; border-color: var(--f-success); box-shadow: 0 0 0 1px var(--f-success); }

        .cert.hidden-card { display: none; }
        .level-group.empty, .col.empty-col { display: none; }

        @media (max-width: 980px) {
            .metrics { grid-template-columns: 1fr 1fr; }
            .overall { grid-column: 1 / -1; }
            .columns { grid-template-columns: 1fr; }
            .legend { width: 100%; margin-left: 0; }
        }
        @media (max-width: 560px) {
            .cert-page { padding: 1.25rem 1rem 4rem; }
            .metrics { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="cert-page">
        <a href="/" class="back-link"><i data-lucide="arrow-left" style="width:14px;height:14px"></i> Back to Flash Cards</a>

        <div class="cert-head">
            <div>
                <h1><span class="accent">Microsoft Credential</span> Tracker</h1>
                <p id="cred-subtitle"></p>
            </div>
            <div class="head-links">
                <a id="explore-link" href="https://aka.ms/ExploreCredentials" target="_blank" rel="noopener"><i data-lucide="external-link" style="width:13px;height:13px"></i> Explore credentials</a>
                <button class="ghost-btn danger" id="reset-btn"><i data-lucide="rotate-ccw" style="width:13px;height:13px"></i> Reset</button>
            </div>
        </div>

        <div class="mode-switch" id="mode-switch" role="tablist" aria-label="Credential type">
            <button class="mode-btn active" data-mode="certs" role="tab" aria-selected="true"><i data-lucide="award" style="width:14px;height:14px"></i> Certifications</button>
            <button class="mode-btn" data-mode="applied" role="tab" aria-selected="false"><i data-lucide="badge-check" style="width:14px;height:14px"></i> Applied Skills</button>
        </div>

        <div class="metrics" id="metrics"></div>
        <div class="status-strip" id="status-strip"></div>

        <div class="toolbar">
            <div class="lvl-filters" id="level-filters">
                <span class="lf-label">Levels</span>
            </div>
            <label class="toggle"><input type="checkbox" id="hide-done"> Hide completed</label>
        </div>

        <div class="toolbar">
            <div class="search">
                <i data-lucide="search" class="s-icon"></i>
                <input type="text" id="search" placeholder="Search by name or exam code…" autocomplete="off">
            </div>
            <div class="legend" id="cred-legend"></div>
        </div>

        <div class="columns" id="columns"></div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
    (function () {
        "use strict";

        // ---- Certification catalogue (source: Microsoft Certification Poster, June 2026) ----
        const CATEGORIES = [
            { key: "cloud",    name: "Cloud & AI Platforms", accent: "#0078d4", icon: "cloud" },
            { key: "aibiz",    name: "AI Business Solutions", accent: "#c239b3", icon: "briefcase-business" },
            { key: "security", name: "Security",              accent: "#498205", icon: "shield-check" },
        ];
        const CERT_LEVELS = ["Fundamentals", "Role-based", "Specialty", "Business"];
        const APPLIED_LEVELS = ["Beginner", "Intermediate"];

        const CERTS = [
            // ---- Cloud & AI Platforms ----
            { code: "AZ-900", title: "Azure Fundamentals", cat: "cloud", level: "Fundamentals", provider: "tech" },
            { code: "AI-900", title: "Azure AI Fundamentals", cat: "cloud", level: "Fundamentals", provider: "tech", note: "Retires end of June 2026" },
            { code: "AI-901", title: "Azure AI Fundamentals (beta)", cat: "cloud", level: "Fundamentals", provider: "tech", beta: true, isNew: true },
            { code: "DP-900", title: "Azure Data Fundamentals", cat: "cloud", level: "Fundamentals", provider: "tech" },

            { code: "AZ-104", title: "Azure Administrator Associate", cat: "cloud", level: "Role-based", provider: "tech" },
            { code: "AZ-204", title: "Azure Developer Associate", cat: "cloud", level: "Role-based", provider: "tech" },
            { code: "AZ-305", title: "Azure Solutions Architect Expert", cat: "cloud", level: "Role-based", provider: "tech", expert: true, prereq: true },
            { code: "AZ-400", title: "DevOps Engineer Expert", cat: "cloud", level: "Role-based", provider: "tech", expert: true, prereq: true },
            { code: "AZ-700", title: "Azure Network Engineer Associate", cat: "cloud", level: "Role-based", provider: "tech" },
            { code: "AZ-800 / AZ-801", title: "Windows Server Hybrid Administrator Associate", cat: "cloud", level: "Role-based", provider: "tech" },
            { code: "AI-102", title: "Azure AI Engineer Associate", cat: "cloud", level: "Role-based", provider: "tech" },
            { code: "AI-103", title: "Azure AI Apps and Agents Developer Associate", cat: "cloud", level: "Role-based", provider: "tech", beta: true, isNew: true },
            { code: "AI-200", title: "Azure AI Cloud Developer Associate", cat: "cloud", level: "Role-based", provider: "tech", beta: true, isNew: true },

        function normalizeMap(m) {
            const out = {};
            for (const [k, v] of Object.entries(m || {})) {
                if (typeof v === "string") {

            const awaiting = scoped.filter(c => statusOf(c.code) === "await").length;
            const pct = total ? Math.round((earned / total) * 100) : 0;
            const dates = earnedCodes.map(k => dateOf(k)).filter(Boolean).sort();
            const today = todayISO();

            // Compact totals strip for the two new statuses.
            const strip = document.getElementById("status-strip");
            if (strip) {
                strip.innerHTML = `
                    <span class="ss s-target"><i data-lucide="target"></i> <b>${targeting}</b> targeting</span>
                    <span class="ss s-await"><i data-lucide="hourglass"></i> <b>${awaiting}</b> awaiting results</span>`;
            }

            // Velocity: certs per month across active span (first earned -> today)
            let perMonth = 0;
            if (dates.length) {
                const span = Math.max(monthsBetween(dates[0], today), 0.5);
                perMonth = earned / span;
            }
            // Recent activity
            const last90 = dates.filter(d => monthsBetween(d, today) <= 3).length;
            const last30 = dates.filter(d => monthsBetween(d, today) <= 1).length;
            const remaining = total - earned;
            // Projection: months to finish at current velocity
            let etaText = "—";
            if (perMonth > 0 && remaining > 0) {
                const m = remaining / perMonth;
                etaText = m >= 12 ? (m / 12).toFixed(1) + " yr" : Math.ceil(m) + " mo";
            } else if (remaining === 0 && earned > 0) {
                etaText = "Done! 🎉";
            }

            elMetrics.innerHTML = `
            <div class="metric-card overall">
                <div class="m-label"><i data-lucide="award" class="m-icon"></i> Overall completion</div>
                <div class="m-top"><span class="pct">${pct}%</span><span class="frac">${earned} of ${total} ${noun}</span></div>
                <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            </div>
            <div class="metric-card">
                <div class="m-label"><i data-lucide="circle-check-big" class="m-icon"></i> Earned</div>
                <div class="m-value">${earned}</div>
                <div class="m-sub">${remaining} remaining</div>
            </div>
            <div class="metric-card">
                <div class="m-label"><i data-lucide="gauge" class="m-icon"></i> Velocity</div>
                <div class="m-value">${perMonth ? perMonth.toFixed(1) : "0"}</div>
                <div class="m-sub">${noun} / month</div>
            </div>
            <div class="metric-card">
                <div class="m-label"><i data-lucide="calendar-clock" class="m-icon"></i> Recent</div>
                <div class="m-value">${last90}</div>
                <div class="m-sub">${last30} in last 30 days</div>
            </div>
            <div class="metric-card">
                <div class="m-label"><i data-lucide="flag" class="m-icon"></i> Est. to finish</div>
                <div class="m-value" style="font-size:1.35rem">${etaText}</div>
                <div class="m-sub">at current pace</div>
            </div>`;
        }

        // ---- Interactions ----
        // Each item has a single status: earned (with date), targeting, awaiting, or none.
        function toggleEarned(code) {
            if (ITEM_BY_CODE[code]?.comingSoon) return; // not yet available
            const cur = progress[code];
            if (cur && cur.st === "earned") delete progress[code];
            else progress[code] = { st: "earned", date: (cur && cur.date) || todayISO() };
            saveProgress(progress);
            render();
        }
        function setStatus(code, status) {
            if (status === "await" && ITEM_BY_CODE[code]?.comingSoon) return;
            const cur = progress[code];
            if (cur && cur.st === status) delete progress[code]; // toggle off
            else progress[code] = { st: status };
            saveProgress(progress);
            render();
        }

        elColumns.addEventListener("click", (e) => {
            if (e.target.closest('input[type="date"]')) return; // handled on change
            if (e.target.closest("a")) return; // let Learn links work
            const card = e.target.closest(".cert");
            if (!card) return;
            const actBtn = e.target.closest(".act-btn");
            if (actBtn) { setStatus(card.dataset.code, actBtn.dataset.status); return; }
            toggleEarned(card.dataset.code); // click on check or card body
        });

        elColumns.addEventListener("keydown", (e) => {
            // Only the check element needs this; .act-btn are native buttons.
            if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("check")) {
                e.preventDefault();
                const card = e.target.closest(".cert");
                if (card) toggleEarned(card.dataset.code);
            }
        });

        elColumns.addEventListener("change", (e) => {
            const input = e.target.closest('input[type="date"]');
            if (!input) return;
            const card = input.closest(".cert");
            progress[card.dataset.code] = { st: "earned", date: input.value || todayISO() };
            saveProgress(progress);
            renderMetrics();
            if (window.lucide) lucide.createIcons();
        });

        // ---- Filters ----
        const searchInput = document.getElementById("search");
        const hideDone = document.getElementById("hide-done");
        function applyFilter() {
            const q = searchInput.value.trim().toLowerCase();
            const hide = hideDone.checked;
            document.querySelectorAll(".cert").forEach(card => {
                const matchQ = !q || card.dataset.search.includes(q);
                const matchDone = !(hide && card.dataset.done === "true");
                card.classList.toggle("hidden-card", !(matchQ && matchDone));
            });
            // hide empty level groups / columns
            document.querySelectorAll(".level-group").forEach(g => {
                const anyVisible = g.querySelector(".cert:not(.hidden-card)");
                g.classList.toggle("empty", !anyVisible);
            });
            document.querySelectorAll(".col").forEach(col => {
                const anyVisible = col.querySelector(".cert:not(.hidden-card)");
                col.classList.toggle("empty-col", !anyVisible);
            });
        }
        searchInput.addEventListener("input", applyFilter);
        hideDone.addEventListener("change", applyFilter);

        // Credential mode switch (Certifications ⇄ Applied Skills) — swaps the whole view.
        elModeSwitch.addEventListener("click", (e) => {
            const btn = e.target.closest(".mode-btn");
            if (!btn || btn.dataset.mode === mode) return;
            mode = btn.dataset.mode;
            searchInput.value = "";
            render();
        });

        // Level filter chips — toggling rescopes the rendered list and ALL metrics.
        elLevelFilters.addEventListener("click", (e) => {
            const chip = e.target.closest(".lvl-chip");
            if (!chip) return;
            const level = chip.dataset.level;
            const set = activeLevels();
            if (set.has(level)) {
                if (set.size === 1) return; // keep at least one level shown
                set.delete(level);
            } else {
                set.add(level);
            }
            render();
        });

        document.getElementById("reset-btn").addEventListener("click", () => {
            if (confirm(`Clear all ${CRED[mode].label} progress? This cannot be undone.`)) {
                items().forEach(c => { delete progress[c.code]; });
                saveProgress(progress);
                render();
            }
        });

        render();
        pullServer(); // reconcile with the account's saved progress when logged in
    })();
    </script>
    <script src="nav.js"></script>
</body>
</html>
