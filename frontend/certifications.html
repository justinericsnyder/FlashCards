            let i = tabs.findIndex(b => b.dataset.mode === mode);
            if (e.key === "ArrowLeft") i = (i - 1 + tabs.length) % tabs.length;
            else if (e.key === "ArrowRight") i = (i + 1) % tabs.length;
            else i = e.key === "Home" ? 0 : tabs.length - 1;
            switchMode(tabs[i].dataset.mode);
            elModeSwitch.querySelectorAll(".mode-btn")[i].focus();
        });

        // Level filter chips — toggling rescopes the rendered list and ALL metrics.
        elLevelFilters.addEventListener("click", (e) => {
            const chip = e.target.closest(".lvl-chip");
            if (!chip) return;
            const level = chip.dataset.level;
            const set = activeLevels();
            if (set.has(level)) {
                if (set.size === 1) return; // keep at least one level shown
                set.delete(level);
            } else {
                set.add(level);
            }
            render();
            saveUIState();
        });

        // ---- Reset (undoable) ----
        // The undo now survives beyond the toast: the backup is persisted until the
        // next reset, so a missed 15-second window isn't permanent data loss (#10).
        document.getElementById("reset-btn").addEventListener("click", () => {
            const label = CRED[mode].label;
            const backup = {};
            items().forEach(c => { if (progress[c.code]) { backup[c.code] = progress[c.code]; delete progress[c.code]; } });
            if (!Object.keys(backup).length) { toast(`No ${label} progress to clear.`); return; }
            try { localStorage.setItem(RESET_BACKUP_KEY, JSON.stringify({ ts: Date.now(), bucket: bucketKey(), data: backup })); } catch { /* best-effort */ }
            saveProgress(progress);
            track("reset");
            render();
            toast(`Cleared ${Object.keys(backup).length} ${label} entries.`, "Undo", () => {
                Object.assign(progress, backup);
                saveProgress(progress);
                try { localStorage.removeItem(RESET_BACKUP_KEY); } catch { /* ignore */ }
                render();
            }, 15000);
        });
        // Recover a persisted reset backup from a previous session (< 24h old).
        (function offerResetRecovery() {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem(RESET_BACKUP_KEY) || "null"); } catch { /* ignore */ }
            if (!saved || saved.bucket !== bucketKey() || Date.now() - saved.ts > 24 * 3600 * 1000) return;
            const stillGone = Object.keys(saved.data || {}).some(code => !progress[code]);
            if (!stillGone) { try { localStorage.removeItem(RESET_BACKUP_KEY); } catch { /* ignore */ } return; }
            toast(`A reset cleared ${Object.keys(saved.data).length} entries recently.`, "Restore", () => {
                const { merged } = mergeProgress(saved.data, progress);
                progress = merged;
                saveProgress(progress);
                try { localStorage.removeItem(RESET_BACKUP_KEY); } catch { /* ignore */ }
                render();
            }, 12000);
        })();

        // ---- Export / Import ----
        const exportBtn = document.getElementById("export-btn");
        const exportMenu = document.getElementById("export-menu");
        function toggleExportMenu(open) {
            const show = open === undefined ? exportMenu.hidden : open;
            exportMenu.hidden = !show;
            exportBtn.setAttribute("aria-expanded", String(show));
            if (show) { const first = exportMenu.querySelector("button"); if (first) first.focus(); }
        }
        exportBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleExportMenu(); });
        document.addEventListener("click", (e) => {
            if (!exportMenu.hidden && !e.target.closest(".export-wrap")) toggleExportMenu(false);
        });
        // role="menu" keyboard contract: arrows cycle, Escape closes and restores focus (#8).
        exportMenu.addEventListener("keydown", (e) => {
            const itemsEls = [...exportMenu.querySelectorAll("button")];
            const i = itemsEls.indexOf(document.activeElement);
            if (e.key === "Escape") { e.preventDefault(); toggleExportMenu(false); exportBtn.focus(); }
            else if (e.key === "ArrowDown") { e.preventDefault(); itemsEls[(i + 1) % itemsEls.length].focus(); }
            else if (e.key === "ArrowUp") { e.preventDefault(); itemsEls[(i - 1 + itemsEls.length) % itemsEls.length].focus(); }
        });
        function download(filename, text, type) {
            const blob = new Blob([text], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        function exportRows() {
            // Export ALL credentials across both families, with each one's status —
            // plus orphaned progress on retired credentials, so a catalogue update
            // never silently drops an achievement from the export (#17).
            const rows = [...CERTS, ...APPLIED_SKILLS].map(c => {
                const p = progress[c.code] || {};
                return {
                    family: c.applied ? "Applied Skill" : "Certification",
                    code: c.applied ? "" : c.code,
                    title: c.title,
                    category: (CATEGORIES.find(x => x.key === c.cat) || {}).name || c.cat,
                    level: c.level,
                    status: p.st || "none",
                    date: p.date || "",
                };
            });
            const retiredByCode = {};
            (RETIRED || []).forEach(r => { retiredByCode[r.code] = r; });
            Object.keys(progress).filter(code => !ITEM_BY_CODE[code]).sort().forEach(code => {
                const p = progress[code];
                rows.push({
                    family: "Retired", code,
                    title: (retiredByCode[code] || {}).title || "",
                    category: "", level: "",
                    status: p.st || "none", date: p.date || "",
                });
            });
            return rows;
        }

        // ---- Import (#11): read a previously exported JSON back in ----
        const importFile = document.getElementById("import-file");
        document.getElementById("import-btn").addEventListener("click", () => {
            toggleExportMenu(false);
            importFile.click();
        });
        importFile.addEventListener("change", async () => {
            const file = importFile.files && importFile.files[0];
            importFile.value = "";
            if (!file) return;
            let rows;
            try { rows = JSON.parse(await file.text()); } catch { toast("That file isn't valid JSON."); return; }
            if (!Array.isArray(rows)) { toast("Expected a JSON export from this page (an array of rows)."); return; }
            const incoming = {};
            for (const r of rows) {
                if (!r || typeof r !== "object" || !["earned", "target", "await"].includes(r.status)) continue;
                // Certs carry their code; Applied Skills are re-keyed from the title.
                const code = r.code || (r.family === "Applied Skill" && r.title ? "as-" + L.slugify(r.title) : null);
                if (!code || (!ITEM_BY_CODE[code] && r.family !== "Retired")) continue;
                incoming[code] = r.status === "earned"
                    ? { st: "earned", date: (L.DATE_RE.test(r.date || "") ? r.date : todayISO()) }
                    : { st: r.status, since: todayISO() };
            }
            const n = Object.keys(incoming).length;
            if (!n) { toast("No usable entries found in that file."); return; }
            const snapshot = JSON.parse(JSON.stringify(progress));
            // Merge, never clobber: existing earned entries always survive (#22 rules).
            const { merged, changedFromLocal } = mergeProgress(progress, normalizeMap(incoming, todayISO()));
            progress = merged;
            saveProgress(progress);
            track("import_json");
            render();
            if (!changedFromLocal) { toast("Import matched your existing progress — nothing to change."); return; }
            toast(`Imported ${changedFromLocal} entr${changedFromLocal === 1 ? "y" : "ies"}.`, "Undo", () => {
                progress = snapshot;
                saveProgress(progress);
                render();
            }, 12000);
        });
        exportMenu.addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-export]");
            if (!btn) return;
            const rows = exportRows();
            const stamp = todayISO();
            if (btn.dataset.export === "json") {
                download(`credential-progress-${stamp}.json`, JSON.stringify(rows, null, 2), "application/json");
            } else {
                const headers = ["family", "code", "title", "category", "level", "status", "date"];
                const esc = v => `"${String(v).replace(/"/g, '""')}"`;
                const csv = [headers.join(","), ...rows.map(r => headers.map(h => esc(r[h])).join(","))].join("\r\n");
                download(`credential-progress-${stamp}.csv`, csv, "text/csv");
            }
            track("export_" + btn.dataset.export);
            toggleExportMenu(false);
        });

        // ---- Copy link (#14): the URL already encodes the full view state ----
        document.getElementById("copy-link-btn").addEventListener("click", async () => {
            syncURL();
            try {
                await navigator.clipboard.writeText(location.href);
                toast("Link to this view copied.");
            } catch {
                toast("Couldn't access the clipboard — copy the address bar URL instead.");
            }
            track("copy_link");
        });

        // ---- Insights: earned timeline (#4) + on-device activity counters (#12) ----
        const insightsBtn = document.getElementById("insights-btn");
        const elInsights = document.getElementById("insights");
        const ACTIVITY_LABELS = {
            mark_earned: "Marked earned", unmark_earned: "Unmarked", set_target: "Set targeting",
            set_await: "Set awaiting", mode_switch: "Mode switches", reset: "Resets",
            export_csv: "CSV exports", export_json: "JSON exports", import_json: "Imports",
            copy_link: "Links copied", toggle_status_filter: "Status filters", freshness_panel: "Catalogue peeks",
        };
        function renderInsights() {
            if (elInsights.hidden) return;
            const earned = [...CERTS, ...APPLIED_SKILLS]
                .filter(c => isEarned(c.code) && dateOf(c.code))
                .sort((a, b) => dateOf(b.code).localeCompare(dateOf(a.code)));
            let tl;
            if (!earned.length) {
                tl = `<p class="tl-empty">Nothing earned yet — your timeline starts with your first check-off.</p>`;
            } else {
                let lastMonth = "";
                tl = earned.map(c => {
                    const d = dateOf(c.code);
                    const [y, m] = d.split("-").map(Number);
                    const monthLabel = new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
                    const head = monthLabel !== lastMonth ? `<div class="tl-month">${monthLabel}</div>` : "";
                    lastMonth = monthLabel;
                    const accent = (CATEGORIES.find(x => x.key === c.cat) || {}).accent || "#888";
                    return `${head}<div class="tl-item"><span class="tl-dot" style="background:${accent}"></span>
                        <span>${escapeHtml(c.title)}</span><span class="tl-date">${escapeHtml(fmtDate(d))}</span></div>`;
                }).join("");
            }
            let stats = {};
            try { stats = JSON.parse(localStorage.getItem(STATS_KEY) || "{}"); } catch { /* ignore */ }
            const chips = Object.entries(stats)
                .sort((a, b) => b[1] - a[1])
                .map(([k, v]) => `<span class="ac">${escapeHtml(ACTIVITY_LABELS[k] || k)} <b>${v}</b></span>`)
                .join("");
            elInsights.innerHTML = `
                <h2><i data-lucide="chart-line"></i> Timeline</h2>
                ${tl}
                <h2 style="margin-top:1rem"><i data-lucide="activity"></i> Activity on this device</h2>
                ${chips || '<p class="tl-empty">No activity recorded yet.</p>'}
                <p class="ins-note">Activity counters live only in this browser — nothing is transmitted.</p>`;
        }
        insightsBtn.addEventListener("click", () => {
            elInsights.hidden = !elInsights.hidden;
            insightsBtn.setAttribute("aria-expanded", String(!elInsights.hidden));
            if (!elInsights.hidden) { renderInsights(); if (window.lucide) lucide.createIcons(); }
        });

        // ---- Multi-tab safety (#9): adopt writes made by another tab ----
        window.addEventListener("storage", (e) => {
            if (e.key !== bucketKey() || e.newValue === null) return;
            progress = loadProgress();
            render();
        });

        // ---- Flush pending sync before the page is hidden/closed (#23) ----
        window.addEventListener("pagehide", flushSync);
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSync(); });

        // ---- Register the service worker for offline support (#14/#27) ----
        // Network-first with cache fallback (see sw.js) means Lucide + fonts are
        // served from cache when offline, so the page no longer breaks.
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
        }

        // ---- Boot ----
        restoreUIState();
        renderFreshness();
        render();
        if (window.lucide) lucide.createIcons();
        pullServer(); // reconcile with the account's saved progress when logged in
        if (adoptedLegacy) {
            // Tell the user their guest/older progress was preserved (#17/#18).
            toast(loggedIn() ? "Imported your earlier progress into this account." : "Restored your saved progress.");
        }
    })();
    </script>
    <script src="nav.js"></script>
</body>
</html>
