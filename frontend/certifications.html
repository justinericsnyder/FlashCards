<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5c518">
    <title>Certification Tracker — Good Better Best</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <!-- Lucide pinned + SRI-verified (was @latest — a silent supply-chain/stability risk). -->
    <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.min.js"
            integrity="sha384-ouAVEJVCMsf8Svzn+BwqbaBhxBEA0xgeVBhHnxmWd+Wqyv18yhWCQwGegFD/OHLq"
            crossorigin="anonymous"></script>
    <style>
        /* ---- Fluent 2 design tokens (light) — scoped to this page ---- */
        .cert-page {
            /* Surfaces, text, brand & success derive from the active app theme (theme.js) */
            --f-canvas: var(--bg-body);
            --f-surface: var(--bg-card);
            --f-surface-2: color-mix(in srgb, var(--text) 7%, var(--bg-card));
            --f-stroke: var(--border);
            --f-stroke-2: color-mix(in srgb, var(--text) 16%, var(--border));
            --f-text: var(--text);
            --f-text-2: var(--text-dim);
            --f-text-3: var(--text-muted);
            --f-brand: var(--primary);
            /* Category accents are intrinsic to the certification poster — kept across themes */
            --f-brand-cloud: #0078d4;
            --f-brand-aibiz: #c239b3;
            --f-brand-security: #498205;
            --f-github: #6e40c9;
            --f-success: var(--success, #34d399);
            --f-success-bg: color-mix(in srgb, var(--success, #34d399) 13%, var(--bg-card));
            --f-success-stroke: color-mix(in srgb, var(--success, #34d399) 45%, var(--border));
            --f-radius: 4px;
            --f-radius-lg: 8px;
            --f-shadow-2: 0 1px 2px rgba(0,0,0,.10), 0 0 1px rgba(0,0,0,.10);
            --f-shadow-4: 0 2px 4px rgba(0,0,0,.12), 0 0 2px rgba(0,0,0,.10);
            --f-shadow-8: 0 4px 8px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
            --f-font: 'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'DM Sans',sans-serif;

            font-family: var(--f-font);
            background: var(--f-canvas);
            color: var(--f-text);
            min-height: 100vh;
            box-sizing: border-box;
            padding: 1.75rem 2rem 4rem;
            max-width: 1320px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
        }
        .cert-page *, .cert-page *::before, .cert-page *::after { box-sizing: border-box; }

        .cert-page .back-link {
            color: var(--f-brand); text-decoration: none; display: inline-flex; align-items: center;
            gap: 0.35rem; margin-bottom: 1rem; font-weight: 600; font-size: 0.82rem;
        }
        .cert-page .back-link:hover { text-decoration: underline; }

        /* ---- Header ---- */
        .cert-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .cert-head h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 0.25rem; line-height: 1.1; }
        .cert-head h1 .accent {
            background: linear-gradient(90deg,#0078d4,#c239b3,#498205);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .cert-head p { color: var(--f-text-2); font-size: 0.9rem; margin: 0; max-width: 46ch; }
        .cert-head .head-links { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .cert-head .head-links a, .cert-page .ghost-btn {
            font-size: 0.78rem; font-weight: 600; color: var(--f-text-2); text-decoration: none;
            border: 1px solid var(--f-stroke-2); background: var(--f-surface); padding: 0.4rem 0.7rem;
            border-radius: var(--f-radius); display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer;
            transition: background .1s, border-color .1s;
        }
        .cert-head .head-links a:hover, .cert-page .ghost-btn:hover { background: var(--f-surface-2); border-color: var(--f-text-3); }
        .cert-page .ghost-btn.danger:hover { color: #b10e1c; border-color: #b10e1c; }

        /* ---- Top metrics ---- */
        .metrics { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
        .metric-card {
            background: var(--f-surface); border: 1px solid var(--f-stroke); border-radius: var(--f-radius-lg);
            padding: 0.9rem 1rem; box-shadow: var(--f-shadow-2);
        }
        .metric-card .m-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--f-text-3); font-weight: 600; display: flex; align-items: center; gap: 0.35rem; }
        .metric-card .m-value { font-size: 1.7rem; font-weight: 700; margin-top: 0.15rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .metric-card .m-sub { font-size: 0.72rem; color: var(--f-text-2); margin-top: 0.15rem; }
        .metric-card .m-icon { width: 14px; height: 14px; }

        .overall { display: flex; flex-direction: column; justify-content: center; }
        .overall .m-top { display: flex; align-items: baseline; gap: 0.5rem; }
        .overall .pct { font-size: 2.1rem; font-weight: 700; color: var(--f-brand); line-height: 1; font-variant-numeric: tabular-nums; }
        .overall .frac { font-size: 0.85rem; color: var(--f-text-2); }
        .progress-track { height: 8px; background: var(--f-surface-2); border-radius: 99px; margin-top: 0.6rem; overflow: hidden; border: 1px solid var(--f-stroke); }
        .progress-fill { height: 100%; background: linear-gradient(90deg,#0078d4,#c239b3,#498205); border-radius: 99px; transition: width .5s cubic-bezier(.2,.9,.3,1); }

        /* ---- Toolbar ---- */
        .toolbar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
        .toolbar .search { position: relative; flex: 1; min-width: 200px; max-width: 380px; }
        .toolbar .search input {
            width: 100%; padding: 0.5rem 0.7rem 0.5rem 2rem; border: 1px solid var(--f-stroke-2);
            border-radius: var(--f-radius); font-size: 0.85rem; font-family: var(--f-font); background: var(--f-surface); color: var(--f-text);
        }
        .toolbar .search input:focus { outline: none; border-color: var(--f-brand); box-shadow: 0 0 0 1px var(--f-brand); }
        .toolbar .search .s-icon { position: absolute; left: 0.55rem; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--f-text-3); }
        .toggle { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--f-text-2); cursor: pointer; user-select: none; font-weight: 600; }
        .toggle input { accent-color: var(--f-brand); width: 15px; height: 15px; }
        .legend { display: flex; gap: 0.9rem; flex-wrap: wrap; margin-left: auto; font-size: 0.72rem; color: var(--f-text-2); }
        .legend span { display: inline-flex; align-items: center; gap: 0.3rem; }
        .legend .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

        /* ---- Level filter chips ---- */
        .lvl-filters { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
        .lvl-filters .lf-label { font-size: 0.7rem; font-weight: 700; color: var(--f-text-3); text-transform: uppercase; letter-spacing: 0.06em; }
        .lvl-chip {
            font-family: var(--f-font); font-size: 0.78rem; font-weight: 600; color: var(--f-text-2);
            background: var(--f-surface); border: 1px solid var(--f-stroke-2); border-radius: 99px;
            padding: 0.32rem 0.72rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
            transition: all .12s; user-select: none;
        }
        .lvl-chip:hover { border-color: var(--f-brand); color: var(--f-text); }
        /* Inactive = clearly muted but still WCAG-legible (was opacity:0.5, too faint on some themes). */
        .lvl-chip:not(.active) { color: var(--f-text-3); border-style: dashed; }
        .lvl-chip.active { background: color-mix(in srgb, var(--f-brand) 15%, var(--f-surface)); border-color: var(--f-brand); color: var(--f-brand); }
        .lvl-chip .lf-check { width: 12px; height: 12px; }
        .lvl-chip:not(.active) .lf-check { display: none; }
        .lvl-chip .lvl-count { font-family: var(--font-mono, monospace); font-size: 0.66rem; color: var(--f-text-3); font-weight: 700; }
        .lvl-chip.active .lvl-count { color: var(--f-brand); }
        .cols-empty { grid-column: 1 / -1; text-align: center; color: var(--f-text-3); padding: 3rem 1rem; font-size: 0.9rem; }

        /* ---- Columns ---- */
        .columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; align-items: start; }
        .col { background: var(--f-surface); border: 1px solid var(--f-stroke); border-radius: var(--f-radius-lg); box-shadow: var(--f-shadow-2); overflow: hidden; }
        .col-head { padding: 0.9rem 1rem 0.8rem; border-top: 3px solid var(--col-accent, var(--f-brand)); }
        .col-head .ch-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        .col-head h2 { font-size: 0.98rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 0.45rem; }
        .col-head h2 .ch-icon { width: 17px; height: 17px; color: var(--col-accent); }
        .col-head .ch-pct { font-size: 1.05rem; font-weight: 700; color: var(--col-accent); font-variant-numeric: tabular-nums; }
        .col-head .ch-frac { font-size: 0.72rem; color: var(--f-text-3); font-weight: 600; }
        .col-progress { height: 6px; background: var(--f-surface-2); border-radius: 99px; margin-top: 0.55rem; overflow: hidden; }
        .col-progress > div { height: 100%; background: var(--col-accent); border-radius: 99px; transition: width .5s cubic-bezier(.2,.9,.3,1); }

        .level-group { padding: 0.4rem 0.7rem 0.7rem; }
        .level-title { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--f-text-3); padding: 0.6rem 0.3rem 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
        .level-title .lt-count { color: var(--f-text-3); font-weight: 600; margin-left: auto; }

        /* ---- Cert card ---- */
        .cert {
            position: relative; display: flex; flex-direction: column; gap: 0.35rem;
            border: 1px solid var(--f-stroke); border-left: 3px solid var(--f-stroke-2);
            border-radius: var(--f-radius); padding: 0.55rem 0.65rem 0.55rem 0.7rem; margin-bottom: 0.4rem;
            background: var(--f-surface); cursor: pointer; transition: box-shadow .1s, border-color .1s, background .15s, transform .08s;
        }
        /* Hover affordance: the whole row is clickable — make that visible (#12). */
        .cert:hover { box-shadow: var(--f-shadow-4); border-left-color: var(--col-accent); background: var(--f-surface-2); }
        .cert:focus-within { outline: 2px solid var(--f-brand); outline-offset: 1px; }
        .cert:active { transform: scale(0.995); }
        .cert .c-main { display: flex; align-items: flex-start; gap: 0.6rem; }
        .cert .c-text { flex: 1; min-width: 0; }
        .cert .c-title { font-size: 0.8rem; font-weight: 600; line-height: 1.25; color: var(--f-text); }
        .cert .c-meta { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.3rem; flex-wrap: wrap; }
        .cert .c-code {
            font-family: var(--font-mono, monospace); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.02em;
            background: var(--f-text); color: var(--f-surface); padding: 0.12rem 0.4rem; border-radius: 3px;
        }
        .cert[data-provider="business"] .c-code { background: var(--f-brand-aibiz); color: #fff; }
        .cert[data-provider="github"] .c-code { background: var(--f-github); color: #fff; }
        .badge { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.1rem 0.32rem; border-radius: 3px; display: inline-flex; align-items: center; gap: 0.2rem; }
        .badge.beta { background: rgba(217,146,10,.16); color: #d9920a; }
        .badge.new { background: rgba(59,130,246,.16); color: #4b91f7; }
        .badge.expert { background: rgba(139,92,246,.16); color: #9b7cf0; }
        .badge.prereq { background: color-mix(in srgb, var(--f-text-3) 22%, transparent); color: var(--f-text-2); }
        .badge.soon { background: color-mix(in srgb, var(--f-text-3) 22%, transparent); color: var(--f-text-2); }
        .badge .b-icon { width: 9px; height: 9px; }

        /* Applied Skills type pill (no exam code) */
        .type-pill { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.12rem 0.42rem; border-radius: 3px; }
        .type-pill.type-tech { background: rgba(0,120,212,.16); color: #2b88d8; }
        .type-pill.type-business { background: color-mix(in srgb, var(--f-brand-aibiz) 18%, transparent); color: var(--f-brand-aibiz); }

        /* Coming-soon Applied Skills — visible but not yet earnable */
        .cert.coming { cursor: default; opacity: 0.72; }
        .cert.coming:hover { box-shadow: none; border-left-color: var(--f-stroke-2); }
        .cert.coming .check { border-style: dashed; cursor: default; }

        /* ---- Per-item status: targeting / awaiting results ---- */
        .c-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
        .act-btn {
            width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--f-stroke-2);
            background: var(--f-surface); color: var(--f-text-3); display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: all .12s; padding: 0;
        }
        .act-btn svg { width: 14px; height: 14px; }
        /* Comfortable tap targets on touch devices (WCAG 2.5.5). */
        @media (pointer: coarse) {
            .act-btn { width: 40px; height: 40px; }
            .check { width: 28px; height: 28px; }
        }
        .act-btn:hover { color: var(--f-text); border-color: var(--f-text-3); }
        .act-btn.act-target[aria-pressed="true"] { background: rgba(217,146,10,.18); border-color: #d9920a; color: #d9920a; }
        .act-btn.act-await[aria-pressed="true"]  { background: rgba(139,92,246,.18); border-color: #9b7cf0; color: #9b7cf0; }

        /* Status accents on the whole card for glanceability */
        .cert.targeting { border-left-color: #d9920a; background: color-mix(in srgb, #d9920a 7%, var(--f-surface)); }
        .cert.awaiting  { border-left-color: #9b7cf0; background: color-mix(in srgb, #9b7cf0 8%, var(--f-surface)); }

        .status-pill { font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.1rem 0.4rem; border-radius: 3px; display: inline-flex; align-items: center; gap: 0.25rem; }
        .status-pill .b-icon { width: 9px; height: 9px; }
        .status-pill.s-target { background: rgba(217,146,10,.16); color: #d9920a; }
        .status-pill.s-await  { background: rgba(139,92,246,.16); color: #9b7cf0; }

        /* Compact totals strip under the metrics */
        .status-strip { display: flex; gap: 1rem; flex-wrap: wrap; margin: -0.5rem 0 1.25rem; font-size: 0.78rem; font-weight: 600; }
        .status-strip .ss { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--f-text-2); }
        .status-strip .ss svg { width: 14px; height: 14px; }
        .status-strip .ss.s-target svg { color: #d9920a; }
        .status-strip .ss.s-await svg { color: #9b7cf0; }
        .status-strip .ss b { color: var(--f-text); font-variant-numeric: tabular-nums; }

        /* ---- Mode switch (segmented control) ---- */
        .mode-switch { display: inline-flex; gap: 0.25rem; padding: 0.25rem; background: var(--f-surface-2); border: 1px solid var(--f-stroke); border-radius: var(--f-radius-lg); margin-bottom: 1.25rem; }
        .mode-btn {
            font-family: var(--f-font); font-size: 0.85rem; font-weight: 600; color: var(--f-text-2);
            background: transparent; border: none; border-radius: calc(var(--f-radius-lg) - 3px);
            padding: 0.45rem 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: all .12s;
        }
        .mode-btn:hover { color: var(--f-text); }
        .mode-btn.active { background: var(--f-surface); color: var(--f-brand); box-shadow: var(--f-shadow-2); }

        /* check control */
        .check {
            flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid var(--f-stroke-2); background: var(--f-surface);
            display: flex; align-items: center; justify-content: center; transition: all .12s; margin-top: 1px;
        }
        .check svg { width: 13px; height: 13px; color: #fff; opacity: 0; transform: scale(0.5); transition: all .12s; }
        .cert:hover .check { border-color: var(--col-accent); }

        /* completed state — high glance contrast */
        .cert.done {
            background: var(--f-success-bg); border-color: var(--f-success-stroke);
            border-left-color: var(--f-success); animation: pop .25s cubic-bezier(.34,1.56,.64,1);
        }
        .cert.done .check { background: var(--f-success); border-color: var(--f-success); }
        .cert.done .check svg { opacity: 1; transform: scale(1); }
        .cert.done .c-title { color: color-mix(in srgb, var(--f-success) 45%, var(--f-text)); }
        @keyframes pop { 0%{transform:scale(.97)} 60%{transform:scale(1.02)} 100%{transform:scale(1)} }

        .done-foot { display: flex; align-items: center; gap: 0.4rem; padding-left: 1.6rem; }
        .done-foot .df-icon { width: 12px; height: 12px; color: var(--f-success); flex-shrink: 0; }
        .done-foot label { font-size: 0.68rem; color: var(--f-success); font-weight: 700; }
        .done-foot input[type=date] {
            font-family: var(--f-font); font-size: 0.7rem; color: var(--f-text); font-weight: 600;
            border: 1px solid var(--f-success-stroke); background: var(--f-surface); border-radius: 3px; padding: 0.1rem 0.3rem; cursor: pointer;
            color-scheme: light dark;
        }
        .done-foot input[type=date]:focus { outline: none; border-color: var(--f-success); box-shadow: 0 0 0 1px var(--f-success); }

        .cert.hidden-card { display: none; }
        .level-group.empty, .col.empty-col { display: none; }

        /* ---- Screen-reader-only utility ---- */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }

        /* ---- Freshness + sync chips in the header ---- */
        .head-meta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.55rem; }
        .chip-badge {
            display: inline-flex; align-items: center; gap: 0.32rem; font-size: 0.68rem; font-weight: 600;
            color: var(--f-text-3); background: var(--f-surface-2); border: 1px solid var(--f-stroke);
            padding: 0.18rem 0.5rem; border-radius: 99px;
        }
        .chip-badge svg { width: 12px; height: 12px; }
        .sync-chip[data-state="syncing"] { color: var(--f-brand); }
        .sync-chip[data-state="synced"]  { color: var(--f-success); border-color: var(--f-success-stroke); }
        .sync-chip[data-state="offline"] { color: #d9920a; }
        .sync-chip[data-state="idle"], .sync-chip[hidden] { display: none; }

        /* ---- Status help line (explains the Targeting / Awaiting icons) ---- */
        .status-help {
            display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
            font-size: 0.72rem; color: var(--f-text-3); margin: -0.4rem 0 1rem;
        }
        .status-help .sh { display: inline-flex; align-items: center; gap: 0.35rem; }
        .status-help svg { width: 13px; height: 13px; }
        .status-help .sh-target svg { color: #d9920a; }
        .status-help .sh-await svg { color: #9b7cf0; }

        /* ---- No-results empty state ---- */
        .no-results { grid-column: 1 / -1; text-align: center; color: var(--f-text-3); padding: 3rem 1rem; font-size: 0.9rem; }
        .no-results[hidden] { display: none; }

        /* ---- Export menu ---- */
        .export-wrap { position: relative; }
        .export-menu {
            position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 180px;
            background: var(--f-surface); border: 1px solid var(--f-stroke-2); border-radius: var(--f-radius-lg);
            box-shadow: var(--f-shadow-8); padding: 0.3rem; display: flex; flex-direction: column; gap: 0.15rem;
        }
        .export-menu[hidden] { display: none; }
        .export-menu button {
            font-family: var(--f-font); font-size: 0.8rem; font-weight: 600; color: var(--f-text-2);
            background: transparent; border: none; border-radius: var(--f-radius); padding: 0.45rem 0.6rem;
            text-align: left; cursor: pointer; display: inline-flex; align-items: center; gap: 0.45rem;
        }
        .export-menu button:hover { background: var(--f-surface-2); color: var(--f-text); }
        .export-menu button svg { width: 14px; height: 14px; }

        /* ---- Toast (undoable reset, migration notice) ---- */
        .toast-host { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
        .toast {
            display: inline-flex; align-items: center; gap: 0.75rem; background: var(--f-text); color: var(--f-surface);
            font-size: 0.82rem; font-weight: 600; padding: 0.6rem 0.9rem; border-radius: var(--f-radius-lg);
            box-shadow: var(--f-shadow-8); animation: toast-in .18s ease-out;
        }
        .toast button {
            font-family: var(--f-font); font-size: 0.8rem; font-weight: 700; color: var(--f-brand);
            background: transparent; border: none; cursor: pointer; padding: 0.1rem 0.3rem;
        }
        .toast button:hover { text-decoration: underline; }
        @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .toast, .cert.done, .progress-fill, .col-progress > div { animation: none !important; transition: none !important; }
        }

        @media (max-width: 980px) {
            .metrics { grid-template-columns: 1fr 1fr; }
            .overall { grid-column: 1 / -1; }
            .columns { grid-template-columns: 1fr; }
            .legend { width: 100%; margin-left: 0; }
        }
        @media (max-width: 560px) {
            .cert-page { padding: 1.25rem 1rem 4rem; }
            .metrics { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="cert-page">
        <a href="/" class="back-link"><i data-lucide="arrow-left" style="width:14px;height:14px"></i> Back to Flash Cards</a>

        <div class="cert-head">
            <div>
                <h1><span class="accent">Microsoft Credential</span> Tracker</h1>
                <p id="cred-subtitle"></p>
                <div class="head-meta">
                    <span class="chip-badge" id="freshness" title="When this catalogue was last reconciled against the Microsoft credential posters."></span>
                    <span class="chip-badge sync-chip" id="sync-chip" data-state="idle" hidden></span>
                </div>
            </div>
            <div class="head-links">
                <a id="explore-link" href="https://aka.ms/ExploreCredentials" target="_blank" rel="noopener"><i data-lucide="external-link" style="width:13px;height:13px"></i> Explore credentials</a>
                <div class="export-wrap">
                    <button class="ghost-btn" id="export-btn" aria-haspopup="true" aria-expanded="false"><i data-lucide="download" style="width:13px;height:13px"></i> Export</button>
                    <div class="export-menu" id="export-menu" role="menu" hidden>
                        <button type="button" role="menuitem" data-export="csv"><i data-lucide="table" style="width:14px;height:14px"></i> Download CSV</button>
                        <button type="button" role="menuitem" data-export="json"><i data-lucide="braces" style="width:14px;height:14px"></i> Download JSON</button>
                    </div>
                </div>
                <button class="ghost-btn danger" id="reset-btn"><i data-lucide="rotate-ccw" style="width:13px;height:13px"></i> Reset</button>
            </div>
        </div>

        <div class="mode-switch" id="mode-switch" role="tablist" aria-label="Credential type">
            <button class="mode-btn active" data-mode="certs" role="tab" aria-selected="true"><i data-lucide="award" style="width:14px;height:14px"></i> Certifications</button>
            <button class="mode-btn" data-mode="applied" role="tab" aria-selected="false"><i data-lucide="badge-check" style="width:14px;height:14px"></i> Applied Skills</button>
        </div>

        <div class="metrics" id="metrics"></div>
        <div class="status-strip" id="status-strip"></div>

        <!-- Explains the two per-item icon actions, which were previously undiscoverable (#16). -->
        <div class="status-help">
            <span class="sh sh-target"><i data-lucide="target"></i> <span><b>Targeting</b> — on your roadmap</span></span>
            <span class="sh sh-await"><i data-lucide="hourglass"></i> <span><b>Awaiting results</b> — exam taken</span></span>
            <span class="sh"><i data-lucide="mouse-pointer-click"></i> <span>Click a card to mark it earned</span></span>
        </div>

        <div class="toolbar">
            <div class="lvl-filters" id="level-filters">
                <span class="lf-label">Levels</span>
            </div>
            <label class="toggle"><input type="checkbox" id="hide-done"> Hide completed</label>
        </div>

        <div class="toolbar">
            <div class="search">
                <i data-lucide="search" class="s-icon"></i>
                <input type="text" id="search" placeholder="Search by name or exam code…" autocomplete="off" aria-label="Search credentials">
            </div>
            <div class="legend" id="cred-legend"></div>
        </div>

        <div class="columns" id="columns"></div>
        <div class="no-results" id="no-results" hidden></div>
    </div>

    <!-- Live region: announces progress changes to screen readers (#9). -->
    <div class="sr-only" id="a11y-live" aria-live="polite" role="status"></div>
    <div class="toast-host" id="toast-host" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="certs-data.js"></script>
    <script src="cert-logic.js"></script>
    <script>
    (function () {
        "use strict";

        // ---- Catalogue + pure logic come from extracted, unit-tested modules ----
        // (Johari #29 data/view split, #26 testable logic.)
        const { CATALOGUE_UPDATED, CATEGORIES, CERT_LEVELS, APPLIED_LEVELS, CERTS, APPLIED_SKILLS } = window.CertData;
        const L = window.CertLogic;
        const { todayISO, fmtDate, normalizeMap, mergeProgress, computeMetrics } = L;

        // Derive a stable storage id for each applied skill and tag it.
        APPLIED_SKILLS.forEach(s => { s.code = "as-" + L.slugify(s.title); s.applied = true; });

        // Credential families share the same UI; each has its own catalogue + level set.
        const CRED = {
            certs:   { label: "Certifications", items: CERTS,          levels: CERT_LEVELS,    learn: "https://aka.ms/ExploreCredentials",
                       blurb: "Track your progress toward Microsoft & GitHub certifications. Check off each as you earn it." },
            applied: { label: "Applied Skills",  items: APPLIED_SKILLS, levels: APPLIED_LEVELS, learn: "https://aka.ms/AppliedSkillsPoster",
                       blurb: "Scenario-based Applied Skills credentials. Check off each as you complete the assessment." },
        };
        const ITEM_BY_CODE = {};
        [...CERTS, ...APPLIED_SKILLS].forEach(c => { ITEM_BY_CODE[c.code] = c; });
        let mode = "certs";
        const items = () => CRED[mode].items;
        const levels = () => CRED[mode].levels;

        const STORAGE_PREFIX = "fc_cert_progress_v1";
        const UI_STATE_KEY = "fc_cert_ui_v1";
        const STATS_KEY = "fc_cert_stats_v1";
        const API_BASE = window.__API_BASE__ || "";
        const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

        // ---- Local, privacy-respecting usage counters (#30) ----
        // Counts stay on the device; nothing is transmitted. Lets us later answer
        // "does anyone use Targeting?" without any tracking infrastructure.
        function track(event) {
            try {
                const s = JSON.parse(localStorage.getItem(STATS_KEY) || "{}");
                s[event] = (s[event] || 0) + 1;
                localStorage.setItem(STATS_KEY, JSON.stringify(s));
            } catch { /* storage full / disabled — analytics are best-effort */ }
        }

        // ---- Per-user storage ----
        // Progress is namespaced per account so multiple users on one browser stay
        // separate, and synced to the server when the user is logged in.
        const hasAuth = typeof Auth !== "undefined";
        function currentUser() { return hasAuth && Auth.getUser ? Auth.getUser() : null; }
        function loggedIn() { return hasAuth && Auth.isLoggedIn && Auth.isLoggedIn(); }
        function bucketKey() {
            const u = currentUser();
            return `${STORAGE_PREFIX}:${u ? (u.id || u.email) : "guest"}`;
        }

        // progress: { [code]: { st: "earned"|"target"|"await", date?: "YYYY-MM-DD" } }
        // (Legacy format was { [code]: "YYYY-MM-DD" } — migrated by CertLogic.normalizeMap.)
        let adoptedLegacy = false; // set when we import guest/legacy data on first load (#17/#18)
        function loadProgress() {
            const key = bucketKey();
            let raw = localStorage.getItem(key);
            if (raw == null) {
                // First load for this bucket — adopt legacy/guest data so nothing is lost:
                // un-namespaced v1 data, or (on first login) progress made while a guest.
                const legacy = localStorage.getItem(STORAGE_PREFIX)
                    || (currentUser() ? localStorage.getItem(`${STORAGE_PREFIX}:guest`) : null);
                if (legacy != null) { localStorage.setItem(key, legacy); raw = legacy; adoptedLegacy = true; }
            }
            try { return normalizeMap(JSON.parse(raw), todayISO()); } catch { return {}; }
        }
        // Status helpers
        const statusOf = code => progress[code] ? progress[code].st : null;
        const dateOf = code => progress[code] ? progress[code].date : null;
        const isEarned = code => statusOf(code) === "earned";
        function saveProgress(p) {
            localStorage.setItem(bucketKey(), JSON.stringify(p));
            pushServer(); // debounced; no-op when logged out
        }
        let progress = loadProgress();

        // ---- Server sync (logged-in users) ----
        const elSyncChip = document.getElementById("sync-chip");
        function setSync(state, label) {
            if (!elSyncChip) return;
            if (state === "idle") { elSyncChip.hidden = true; elSyncChip.dataset.state = "idle"; return; }
            elSyncChip.hidden = false;
            elSyncChip.dataset.state = state;
            const icon = state === "syncing" ? "refresh-cw" : state === "offline" ? "cloud-off" : "cloud-check";
            elSyncChip.innerHTML = `<i data-lucide="${icon}"></i> ${label}`;
            if (window.lucide) lucide.createIcons();
        }
        let syncTimer = null;
        function doPush() {
            if (!loggedIn()) return Promise.resolve();
            setSync("syncing", "Syncing…");
            // keepalive lets this survive a tab close / navigation (part of #23).
            return Auth.apiFetch(`${API_BASE}/api/cert-progress`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ data: progress }),
                keepalive: true,
            }).then(res => setSync(res && res.ok ? "synced" : "offline", res && res.ok ? "Saved" : "Not saved"))
              .catch(() => setSync("offline", "Offline"));
        }
        function pushServer(immediate) {
            if (!loggedIn()) return;
            clearTimeout(syncTimer);
            if (immediate) doPush(); else syncTimer = setTimeout(doPush, 700);
        }
        // Flush any pending write before the page goes away so the last change isn't lost (#23).
        function flushSync() {
            if (!loggedIn() || syncTimer == null) return;
            clearTimeout(syncTimer); syncTimer = null;
            doPush();
        }
        async function pullServer() {
            if (!loggedIn()) { setSync("idle"); return; }
            setSync("syncing", "Syncing…");
            try {
                const res = await Auth.apiFetch(`${API_BASE}/api/cert-progress`);
                if (!res.ok) { setSync("offline", "Offline"); return; }
                const server = normalizeMap((await res.json()).data, todayISO());
                // Non-destructive reconcile: earned always survives, earliest date wins (#22).
                const { merged, changedLocally } = mergeProgress(progress, server);
                progress = merged;
                localStorage.setItem(bucketKey(), JSON.stringify(progress));
                render();
                if (changedLocally) pushServer(true); else setSync("synced", "Saved");
            } catch { setSync("offline", "Offline"); }
        }

        // Which levels are shown — drives both the rendered list AND all metrics.
        // Tracked per credential family so switching modes keeps each one's filters.
        const activeLevelsByMode = {
            certs: new Set(CERT_LEVELS),
            applied: new Set(APPLIED_LEVELS),
        };
        const activeLevels = () => activeLevelsByMode[mode];
        const scopedCerts = () => items().filter(c => activeLevels().has(c.level));

        // ---- Persisted UI state (mode, level filters, hide-completed, search) (#3) ----
        const searchInput = document.getElementById("search");
        const hideDone = document.getElementById("hide-done");
        function saveUIState() {
            try {
                localStorage.setItem(UI_STATE_KEY, JSON.stringify({
                    mode,
                    hideDone: hideDone.checked,
                    levels: { certs: [...activeLevelsByMode.certs], applied: [...activeLevelsByMode.applied] },
                }));
            } catch { /* ignore */ }
            syncURL();
        }
        function syncURL() {
            // Shareable deep link: mode + search query in the URL (#3).
            try {
                const p = new URLSearchParams();
                if (mode !== "certs") p.set("mode", mode);
                const q = searchInput.value.trim();
                if (q) p.set("q", q);
                const qs = p.toString();
                history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
            } catch { /* ignore */ }
        }
        function restoreUIState() {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(UI_STATE_KEY) || "{}") || {}; } catch { /* ignore */ }
            const url = new URLSearchParams(location.search);
            const urlMode = url.get("mode");
            if (urlMode === "certs" || urlMode === "applied") mode = urlMode;
            else if (saved.mode === "certs" || saved.mode === "applied") mode = saved.mode;
            if (typeof saved.hideDone === "boolean") hideDone.checked = saved.hideDone;
            if (saved.levels) {
                for (const m of ["certs", "applied"]) {
                    if (Array.isArray(saved.levels[m]) && saved.levels[m].length) {
                        const valid = saved.levels[m].filter(l => CRED[m].levels.includes(l));
                        if (valid.length) activeLevelsByMode[m] = new Set(valid);
                    }
                }
            }
            const q = url.get("q");
            if (q) searchInput.value = q;
        }

        const elColumns = document.getElementById("columns");
        const elMetrics = document.getElementById("metrics");
        const elSubtitle = document.getElementById("cred-subtitle");
        const elExplore = document.getElementById("explore-link");
        const elLegend = document.getElementById("cred-legend");
        const elModeSwitch = document.getElementById("mode-switch");
        const elNoResults = document.getElementById("no-results");
        const elLive = document.getElementById("a11y-live");
        const elToastHost = document.getElementById("toast-host");

        function announce(msg) { if (elLive) elLive.textContent = msg; }

        // ---- Toasts (undoable reset + migration notice) ----
        function toast(message, actionLabel, onAction, timeout = 6000) {
            const el = document.createElement("div");
            el.className = "toast";
            el.innerHTML = `<span></span>`;
            el.querySelector("span").textContent = message;
            let timer;
            const dismiss = () => { clearTimeout(timer); el.remove(); };
            if (actionLabel) {
                const btn = document.createElement("button");
                btn.type = "button"; btn.textContent = actionLabel;
                btn.addEventListener("click", () => { onAction && onAction(); dismiss(); });
                el.appendChild(btn);
            }
            elToastHost.appendChild(el);
            timer = setTimeout(dismiss, timeout);
        }

        function renderFreshness() {
            const el = document.getElementById("freshness");
            if (el) el.innerHTML = `<i data-lucide="refresh-ccw-dot"></i> Catalogue updated ${fmtDate(CATALOGUE_UPDATED)}`;
        }

        function renderModeUI() {
            elSubtitle.textContent = CRED[mode].blurb;
            elExplore.href = CRED[mode].learn;
            elModeSwitch.querySelectorAll(".mode-btn").forEach(b => {
                const on = b.dataset.mode === mode;
                b.classList.toggle("active", on);
                b.setAttribute("aria-selected", on);
            });
            elLegend.innerHTML = mode === "applied"
                ? `<span><span class="dot" style="background:#0078d4"></span> Technical</span>
                   <span><span class="dot" style="background:#c239b3"></span> Business</span>`
                : `<span><span class="dot" style="background:var(--text)"></span> Microsoft technical</span>
                   <span><span class="dot" style="background:#c239b3"></span> Microsoft business</span>
                   <span><span class="dot" style="background:#6e40c9"></span> GitHub</span>`;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        function certCardHTML(c) {
            const st = statusOf(c.code);
            const date = dateOf(c.code);
            const done = st === "earned";
            const soon = !!c.comingSoon;
            const badges = [];
            if (c.expert) badges.push('<span class="badge expert"><i data-lucide="star" class="b-icon"></i>Expert</span>');
            if (c.prereq) badges.push('<span class="badge prereq"><i data-lucide="lock" class="b-icon"></i>Prereq</span>');
            if (c.beta) badges.push('<span class="badge beta">Beta</span>');
            if (c.isNew) badges.push('<span class="badge new">New</span>');
            if (soon) badges.push('<span class="badge soon"><i data-lucide="clock" class="b-icon"></i>Coming soon</span>');
            if (st === "target") badges.push('<span class="status-pill s-target"><i data-lucide="target" class="b-icon"></i>Targeting</span>');
            if (st === "await") badges.push('<span class="status-pill s-await"><i data-lucide="hourglass" class="b-icon"></i>Awaiting results</span>');
            // Certifications carry an exam code; Applied Skills show their Technical/Business type.
            const chip = c.applied
                ? `<span class="type-pill type-${c.provider}">${c.provider === "business" ? "Business" : "Technical"}</span>`
                : `<span class="c-code">${escapeHtml(c.code)}</span>`;
            const learn = c.applied
                ? `https://learn.microsoft.com/credentials/browse/?terms=${encodeURIComponent(c.title)}&types=appliedskills`
                : `https://learn.microsoft.com/credentials/browse/?terms=${encodeURIComponent(c.code.split(" / ")[0])}`;
            const linkTitle = c.applied ? "View on Microsoft Learn" : `${c.note ? escapeHtml(c.note) + ' · ' : ''}View on Microsoft Learn`;
            const cls = done ? " done" : st === "target" ? " targeting" : st === "await" ? " awaiting" : "";
            const stateWord = done ? "earned" : st === "target" ? "targeting" : st === "await" ? "awaiting results" : "not earned";
            const checkLabel = soon
                ? `${escapeHtml(c.title)} — not yet earnable`
                : `${escapeHtml(c.title)}, currently ${stateWord}. Activate to ${done ? "clear" : "mark earned"}.`;
            return `
            <div class="cert${cls}${soon ? " coming" : ""}" role="listitem" data-code="${escapeHtml(c.code)}" data-cat="${c.cat}" data-provider="${c.provider}" data-status="${st || ""}"
                 data-search="${escapeHtml((c.title + " " + c.code).toLowerCase())}" data-done="${done}">
                <div class="c-main">
                    <div class="check"${soon ? "" : ` role="checkbox" aria-checked="${done}" tabindex="0"`}
                         title="${soon ? "Not yet earnable" : (done ? "Click to unmark" : "Click to mark earned")}"
                         aria-label="${checkLabel}">${ICON_CHECK}</div>
                    <div class="c-text">
                        <a class="c-title" href="${learn}" target="_blank" rel="noopener" title="${linkTitle}">${escapeHtml(c.title)}</a>
                        <div class="c-meta">
                            ${chip}
                            ${badges.join("")}
                        </div>
                        ${soon ? '<div class="c-meta" style="font-size:0.66rem;color:var(--f-text-3)">Not yet earnable — check back later.</div>' : ''}
                    </div>
                    <div class="c-actions">
                        <button type="button" class="act-btn act-target" data-status="target" aria-pressed="${st === "target"}"
                                title="${st === "target" ? "Remove from targets" : "I'm targeting this"}" aria-label="Targeting"${soon ? " disabled style=\"display:none\"" : ""}>
                            <i data-lucide="target"></i>
                        </button>
                        <button type="button" class="act-btn act-await" data-status="await" aria-pressed="${st === "await"}"
                                title="${st === "await" ? "Clear awaiting status" : "Taken — awaiting results"}" aria-label="Awaiting results"${soon ? " disabled style=\"display:none\"" : ""}>
                            <i data-lucide="hourglass"></i>
                        </button>
                    </div>
                </div>
                ${done ? `
                <div class="done-foot">
                    <i data-lucide="badge-check" class="df-icon"></i>
                    <label>${c.applied ? "Completed" : "Earned"}</label>
                    <input type="date" value="${date}" max="${todayISO()}" title="Date earned — you can log a past exam date here." aria-label="Date for ${escapeHtml(c.title)}">
                </div>` : ""}
            </div>`;
        }

        const elLevelFilters = document.getElementById("level-filters");
        function renderLevelFilters() {
            const chips = levels().map(level => {
                const lvlCerts = items().filter(c => c.level === level);
                const lDone = lvlCerts.filter(c => isEarned(c.code)).length;
                const on = activeLevels().has(level);
                return `<button type="button" class="lvl-chip${on ? " active" : ""}" data-level="${level}" aria-pressed="${on}">
                    <i data-lucide="check" class="lf-check"></i>${level}
                    <span class="lvl-count">${lDone}/${lvlCerts.length}</span>
                </button>`;
            }).join("");
            elLevelFilters.innerHTML = `<span class="lf-label">Levels</span>${chips}`;
        }

        function render() {
            renderModeUI();
            renderLevelFilters();
            if (!activeLevels().size) {
                elColumns.innerHTML = `<div class="cols-empty">Select at least one level to display certifications.</div>`;
                renderMetrics();
                if (window.lucide) lucide.createIcons();
                return;
            }
            elColumns.innerHTML = CATEGORIES.map(cat => {
                const catCerts = scopedCerts().filter(c => c.cat === cat.key);
                const earned = catCerts.filter(c => isEarned(c.code)).length;
                const pct = catCerts.length ? Math.round((earned / catCerts.length) * 100) : 0;
                const levelsHTML = levels().map(level => {
                    const levelCerts = catCerts.filter(c => c.level === level);
                    if (!levelCerts.length) return "";
                    const lDone = levelCerts.filter(c => isEarned(c.code)).length;
                    return `
                    <div class="level-group" role="list" data-level="${level}">
                        <div class="level-title">${level}<span class="lt-count">${lDone}/${levelCerts.length}</span></div>
                        ${levelCerts.map(certCardHTML).join("")}
                    </div>`;
                }).join("");
                return `
                <section class="col" data-cat="${cat.key}" style="--col-accent:${cat.accent}">
                    <div class="col-head">
                        <div class="ch-top">
                            <h2><i data-lucide="${cat.icon}" class="ch-icon"></i>${cat.name}</h2>
                            <div style="text-align:right">
                                <div class="ch-pct">${pct}%</div>
                                <div class="ch-frac">${earned}/${catCerts.length}</div>
                            </div>
                        </div>
                        <div class="col-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${cat.name} completion"><div style="width:${pct}%"></div></div>
                    </div>
                    ${levelsHTML}
                </section>`;
            }).join("");

            renderMetrics();
            if (window.lucide) lucide.createIcons();
            applyFilter();
        }

        // Update ONE card in place without rebuilding #columns — preserves keyboard
        // focus and scroll position (Johari #4 perf, #8 focus loss).
        function updateCard(code) {
            const oldCard = [...elColumns.querySelectorAll(".cert")].find(el => el.dataset.code === code);
            if (!oldCard) { render(); return; }
            const active = document.activeElement;
            let restoreSel = null;
            if (oldCard.contains(active)) {
                if (active.classList.contains("check")) restoreSel = ".check";
                else if (active.classList.contains("act-target")) restoreSel = ".act-target";
                else if (active.classList.contains("act-await")) restoreSel = ".act-await";
            }
            const tmp = document.createElement("div");
            tmp.innerHTML = certCardHTML(ITEM_BY_CODE[code]).trim();
            const newCard = tmp.firstElementChild;
            oldCard.replaceWith(newCard);
            if (window.lucide) lucide.createIcons(); // only converts the new <i> placeholders
            if (restoreSel) { const t = newCard.querySelector(restoreSel); if (t) t.focus(); }
            refreshAggregates();
            applyFilter(); // class-only pass: refreshes group/column emptiness + no-results, keeps focus
        }

        // Recompute header %/fractions and level counts in place (no #columns rebuild).
        function recalcColumnHeaders() {
            CATEGORIES.forEach(cat => {
                const sec = elColumns.querySelector(`.col[data-cat="${cat.key}"]`);
                if (!sec) return;
                const catCerts = scopedCerts().filter(c => c.cat === cat.key);
                const earned = catCerts.filter(c => isEarned(c.code)).length;
                const pct = catCerts.length ? Math.round((earned / catCerts.length) * 100) : 0;
                const pctEl = sec.querySelector(".ch-pct"); if (pctEl) pctEl.textContent = pct + "%";
                const fracEl = sec.querySelector(".ch-frac"); if (fracEl) fracEl.textContent = `${earned}/${catCerts.length}`;
                const bar = sec.querySelector(".col-progress");
                if (bar) { bar.setAttribute("aria-valuenow", pct); bar.firstElementChild.style.width = pct + "%"; }
                levels().forEach(level => {
                    const lg = sec.querySelector(`.level-group[data-level="${level}"]`);
                    if (!lg) return;
                    const levelCerts = catCerts.filter(c => c.level === level);
                    const lDone = levelCerts.filter(c => isEarned(c.code)).length;
                    const ct = lg.querySelector(".lt-count");
                    if (ct) ct.textContent = `${lDone}/${levelCerts.length}`;
                });
            });
        }

        // Metrics + status strip + level filter chips (none hold interaction focus).
        function refreshAggregates() {
            renderMetrics();
            renderLevelFilters();
            recalcColumnHeaders();
            if (window.lucide) lucide.createIcons();
        }

        function renderMetrics() {
            const noun = mode === "applied" ? "skills" : "certs";
            const scoped = scopedCerts();
            const m = computeMetrics(scoped, progress, todayISO());

            const strip = document.getElementById("status-strip");
            if (strip) {
                strip.innerHTML = `
                    <span class="ss s-target"><i data-lucide="target"></i> <b>${m.targeting}</b> targeting</span>
                    <span class="ss s-await"><i data-lucide="hourglass"></i> <b>${m.awaiting}</b> awaiting results</span>`;
            }

            elMetrics.innerHTML = `
            <div class="metric-card overall">
                <div class="m-label"><i data-lucide="award" class="m-icon"></i> Overall completion</div>
                <div class="m-top"><span class="pct">${m.pct}%</span><span class="frac">${m.earned} of ${m.total} ${noun}</span></div>
                <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${m.pct}" aria-label="Overall completion"><div class="progress-fill" style="width:${m.pct}%"></div></div>
            </div>
            <div class="metric-card">
                <div class="m-label"><i data-lucide="circle-check-big" class="m-icon"></i> Earned</div>
                <div class="m-value">${m.earned}</div>
                <div class="m-sub">${m.remaining} remaining</div>
            </div>
            <div class="metric-card">
                <div class="m-label"><i data-lucide="gauge" class="m-icon"></i> Velocity</div>
                <div class="m-value">${m.perMonth ? m.perMonth.toFixed(1) : "0"}</div>
                <div class="m-sub">${noun} / month</div>
            </div>
            <div class="metric-card">
                <div class="m-label"><i data-lucide="calendar-clock" class="m-icon"></i> Recent</div>
                <div class="m-value">${m.last90}</div>
                <div class="m-sub">${m.last30} in last 30 days</div>
            </div>
            <div class="metric-card" title="Projected from your velocity: remaining ÷ (earned so far ÷ months since your first earned date).">
                <div class="m-label"><i data-lucide="flag" class="m-icon"></i> Est. to finish <i data-lucide="info" class="m-icon" style="opacity:.6"></i></div>
                <div class="m-value" style="font-size:1.35rem">${m.etaText}</div>
                <div class="m-sub">at current pace</div>
            </div>`;
        }

        // ---- Interactions ----
        // Each item has a single status: earned (with date), targeting, awaiting, or none.
        function toggleEarned(code) {
            if (ITEM_BY_CODE[code]?.comingSoon) return; // not yet available
            const cur = progress[code];
            const nowEarned = !(cur && cur.st === "earned");
            if (cur && cur.st === "earned") delete progress[code];
            else progress[code] = { st: "earned", date: (cur && cur.date) || todayISO() };
            saveProgress(progress);
            track(nowEarned ? "mark_earned" : "unmark_earned");
            announce(`${ITEM_BY_CODE[code].title} ${nowEarned ? "marked earned" : "unmarked"}.`);
            updateCard(code);
        }
        function setStatus(code, status) {
            if (status === "await" && ITEM_BY_CODE[code]?.comingSoon) return;
            const cur = progress[code];
            const cleared = cur && cur.st === status;
            if (cleared) delete progress[code]; // toggle off
            else progress[code] = { st: status };
            saveProgress(progress);
            track(status === "target" ? "set_target" : "set_await");
            updateCard(code);
        }

        elColumns.addEventListener("click", (e) => {
            if (e.target.closest('input[type="date"]')) return; // handled on change
            if (e.target.closest("a")) return; // let Learn links work
            const card = e.target.closest(".cert");
            if (!card) return;
            const actBtn = e.target.closest(".act-btn");
            if (actBtn) { setStatus(card.dataset.code, actBtn.dataset.status); return; }
            toggleEarned(card.dataset.code); // click on check or card body
        });

        elColumns.addEventListener("keydown", (e) => {
            // Only the check element needs this; .act-btn are native buttons.
            if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("check")) {
                e.preventDefault();
                const card = e.target.closest(".cert");
                if (card) toggleEarned(card.dataset.code);
            }
        });

        elColumns.addEventListener("change", (e) => {
            const input = e.target.closest('input[type="date"]');
            if (!input) return;
            const card = input.closest(".cert");
            progress[card.dataset.code] = { st: "earned", date: input.value || todayISO() };
            saveProgress(progress);
            refreshAggregates(); // keep focus on the date field — no full re-render
        });

        // ---- Filters ----
        function applyFilterToCard(card) {
            const q = searchInput.value.trim().toLowerCase();
            const hide = hideDone.checked;
            const matchQ = !q || card.dataset.search.includes(q);
            const matchDone = !(hide && card.dataset.done === "true");
            card.classList.toggle("hidden-card", !(matchQ && matchDone));
        }
        function applyFilter() {
            const q = searchInput.value.trim().toLowerCase();
            let visible = 0;
            document.querySelectorAll(".cert").forEach(card => {
                applyFilterToCard(card);
                if (!card.classList.contains("hidden-card")) visible++;
            });
            // hide empty level groups / columns
            document.querySelectorAll(".level-group").forEach(g => {
                g.classList.toggle("empty", !g.querySelector(".cert:not(.hidden-card)"));
            });
            document.querySelectorAll(".col").forEach(col => {
                col.classList.toggle("empty-col", !col.querySelector(".cert:not(.hidden-card)"));
            });
            // No-results empty state (#2) — only meaningful when a filter is active.
            const filtering = q || hideDone.checked;
            if (elNoResults) {
                if (visible === 0 && filtering) {
                    elNoResults.hidden = false;
                    elNoResults.textContent = q
                        ? `No credentials match “${searchInput.value.trim()}”.`
                        : "All credentials are completed and hidden.";
                } else {
                    elNoResults.hidden = true;
                }
            }
        }
        let searchDebounce = null;
        searchInput.addEventListener("input", () => {
            clearTimeout(searchDebounce); // debounce keystrokes (#1)
            searchDebounce = setTimeout(() => { applyFilter(); saveUIState(); }, 150);
        });
        hideDone.addEventListener("change", () => { applyFilter(); saveUIState(); track("toggle_hide_done"); });

        // Credential mode switch (Certifications ⇄ Applied Skills) — swaps the whole view.
        elModeSwitch.addEventListener("click", (e) => {
            const btn = e.target.closest(".mode-btn");
            if (!btn || btn.dataset.mode === mode) return;
            mode = btn.dataset.mode;
            searchInput.value = "";
            track("mode_switch");
            render();
            saveUIState();
        });

        // Level filter chips — toggling rescopes the rendered list and ALL metrics.
        elLevelFilters.addEventListener("click", (e) => {
            const chip = e.target.closest(".lvl-chip");
            if (!chip) return;
            const level = chip.dataset.level;
            const set = activeLevels();
            if (set.has(level)) {
                if (set.size === 1) return; // keep at least one level shown
                set.delete(level);
            } else {
                set.add(level);
            }
            render();
            saveUIState();
        });

        // ---- Reset (undoable, no blocking confirm) (#5) ----
        document.getElementById("reset-btn").addEventListener("click", () => {
            const label = CRED[mode].label;
            const backup = {};
            items().forEach(c => { if (progress[c.code]) { backup[c.code] = progress[c.code]; delete progress[c.code]; } });
            if (!Object.keys(backup).length) { toast(`No ${label} progress to clear.`); return; }
            saveProgress(progress);
            track("reset");
            render();
            toast(`Cleared ${Object.keys(backup).length} ${label} entries.`, "Undo", () => {
                Object.assign(progress, backup);
                saveProgress(progress);
                render();
            });
        });

        // ---- Export (#28) ----
        const exportBtn = document.getElementById("export-btn");
        const exportMenu = document.getElementById("export-menu");
        function toggleExportMenu(open) {
            const show = open === undefined ? exportMenu.hidden : open;
            exportMenu.hidden = !show;
            exportBtn.setAttribute("aria-expanded", String(show));
        }
        exportBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleExportMenu(); });
        document.addEventListener("click", (e) => {
            if (!exportMenu.hidden && !e.target.closest(".export-wrap")) toggleExportMenu(false);
        });
        function download(filename, text, type) {
            const blob = new Blob([text], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        function exportRows() {
            // Export ALL credentials across both families, with each one's status.
            return [...CERTS, ...APPLIED_SKILLS].map(c => {
                const p = progress[c.code] || {};
                return {
                    family: c.applied ? "Applied Skill" : "Certification",
                    code: c.applied ? "" : c.code,
                    title: c.title,
                    category: (CATEGORIES.find(x => x.key === c.cat) || {}).name || c.cat,
                    level: c.level,
                    status: p.st || "none",
                    date: p.date || "",
                };
            });
        }
        exportMenu.addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-export]");
            if (!btn) return;
            const rows = exportRows();
            const stamp = todayISO();
            if (btn.dataset.export === "json") {
                download(`credential-progress-${stamp}.json`, JSON.stringify(rows, null, 2), "application/json");
            } else {
                const headers = ["family", "code", "title", "category", "level", "status", "date"];
                const esc = v => `"${String(v).replace(/"/g, '""')}"`;
                const csv = [headers.join(","), ...rows.map(r => headers.map(h => esc(r[h])).join(","))].join("\r\n");
                download(`credential-progress-${stamp}.csv`, csv, "text/csv");
            }
            track("export_" + btn.dataset.export);
            toggleExportMenu(false);
        });

        // ---- Flush pending sync before the page is hidden/closed (#23) ----
        window.addEventListener("pagehide", flushSync);
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSync(); });

        // ---- Register the service worker for offline support (#14/#27) ----
        // Network-first with cache fallback (see sw.js) means Lucide + fonts are
        // served from cache when offline, so the page no longer breaks.
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
        }

        // ---- Boot ----
        restoreUIState();
        renderFreshness();
        render();
        if (window.lucide) lucide.createIcons();
        pullServer(); // reconcile with the account's saved progress when logged in
        if (adoptedLegacy) {
            // Tell the user their guest/older progress was preserved (#17/#18).
            toast(loggedIn() ? "Imported your earlier progress into this account." : "Restored your saved progress.");
        }
    })();
    </script>
    <script src="nav.js"></script>
</body>
</html>
