<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog — Good Better Best</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .changelog-container { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem; }
        .back-link { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem; font-weight: 500; font-size: 0.85rem; opacity: 0.8; }
        .back-link:hover { opacity: 1; }
        .changelog-date-group { margin-bottom: 1.5rem; }
        .changelog-date { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border-subtle); font-family: var(--font-mono); }
        .changelog-entry { display: flex; gap: 0.6rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border-subtle); }
        .changelog-entry:last-child { border-bottom: none; }
        .changelog-tag { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.15rem 0.45rem; border-radius: 4px; flex-shrink: 0; height: fit-content; margin-top: 0.15rem; }
        .tag-feature { background: rgba(245,197,24,0.12); color: var(--primary); }
        .tag-fix { background: rgba(52,211,153,0.12); color: var(--success); }
        .tag-design { background: rgba(129,140,248,0.12); color: #818cf8; }
        .tag-infra { background: rgba(148,163,184,0.12); color: var(--text-dim); }
        .changelog-text { font-size: 0.82rem; color: var(--text-dim); line-height: 1.5; }
        .changelog-summary { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .summary-stat { text-align: center; }
        .summary-stat .num { font-size: 1.25rem; font-weight: 800; color: var(--primary); font-family: var(--font-mono); }
        .summary-stat .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    </style>
</head>
<body>
    <div class="changelog-container">
        <a href="/" class="back-link">← Back</a>
        <header>
            <h1><i data-lucide="file-text" style="display:inline;vertical-align:-3px;width:1.2em;height:1.2em;stroke:var(--primary)"></i> Changelog</h1>
            <p>What's new and improved</p>
        </header>
        <div id="changelog-content"></div>
    </div>
    <script>
        const entries = [
            { date: '2026-06-07', tag: 'docs', text: 'Synchronized the public changelog with repository PR history and updated the root changelog page.' },
            { date: '2026-06-07', tag: 'fix', text: 'Added footer changelog link on the main site for easier discovery.' },
            { date: '2026-06-07', tag: 'feature', text: 'Improved review sync messaging, due card counts, and auth token validation across sessions.' },
            { date: '2026-06-07', tag: 'infra', text: 'Added auth validation on page load to clear expired sessions and keep the UI consistent.' },
            { date: '2026-04-19', tag: 'docs', text: 'Added 7 Mermaid architecture diagrams to README for system overview, user flow, AI integration, data model, SM-2 flow, gamification pipeline, page map, and deployment.' },
            { date: '2026-04-19', tag: 'security', text: 'Hardened README by removing endpoint maps, database schema details, package version lists, and deployment specifics.' },
            { date: '2026-04-19', tag: 'docs', text: 'Rewrote README with a clear architecture overview, services table, and tech stack summary.' },
            { date: '2026-04-15', tag: 'feature', text: 'Added Skills Tested modal to extract certification skills and fetch actual study guide details.' },
            { date: '2026-04-15', tag: 'feature', text: 'Added study settings modal for card count, difficulty, and timer before certification study sessions.' },
            { date: '2026-04-15', tag: 'feature', text: 'Included Applied Skills from Microsoft Catalog API with filtering by skill type.' },
            { date: '2026-04-15', tag: 'feature', text: 'Added 6 hyperscaler themes with light and dark variants.' },
            { date: '2026-04-15', tag: 'fix', text: 'Derived study guide URL from exam code instead of broken href scraping.' },
            { date: '2026-04-15', tag: 'fix', text: 'Removed sidebar max-height constraint so recent topics do not clip on desktop.' },
            { date: '2026-04-15', tag: 'fix', text: 'Improved mobile responsive layout with single-column controls, fixed font sizes, stacking, and 240px narrow support.' },
            { date: '2026-04-15', tag: 'fix', text: 'Updated service worker auto-update behavior so mobile clients refresh without manual reload.' },
            { date: '2026-04-13', tag: 'feature', text: 'Added dynamic certification catalog with filtering by area, level, and certification type.' },
            { date: '2026-04-13', tag: 'feature', text: 'Added certification goal system with personalized readiness scoring.' },
            { date: '2026-04-13', tag: 'design', text: 'Rebranded to Good Better Best with custom logo, favicon, and new brand styling.' },
            { date: '2026-04-13', tag: 'design', text: 'Added icon-only sidebar navigation with hover popovers and grouped menu items.' },
            { date: '2026-04-13', tag: 'design', text: 'Shared navigation injected across all pages for consistent experience.' },
            { date: '2026-04-13', tag: 'design', text: 'Added mobile tab layout with a More menu and pinned desktop sidebar.' },
            { date: '2026-04-13', tag: 'fix', text: 'Fixed achievement toasts so they only trigger for newly earned badges.' },
            { date: '2026-04-13', tag: 'fix', text: 'Fixed nav hover gap and theme persistence across pages.' },
            { date: '2026-04-13', tag: 'infra', text: 'Switched service worker to network-first caching to prevent stale UI.' },
            { date: '2026-04-13', tag: 'infra', text: 'Fixed CI builds to skip server.listen during test mode.' },
            { date: '2026-04-12', tag: 'feature', text: 'Added spaced repetition with SM-2 algorithm and review scheduling.' },
            { date: '2026-04-12', tag: 'feature', text: 'Added 29 unlockable achievement badges and tiers.' },
            { date: '2026-04-12', tag: 'feature', text: 'Added Socratic Mode conversational AI coaching.' },
            { date: '2026-04-12', tag: 'feature', text: 'Added AI-powered weakness reports and certification readiness scoring.' },
            { date: '2026-04-12', tag: 'feature', text: 'Added Teach-Back Mode and multiple question types including scenario-based questions.' },
            { date: '2026-04-12', tag: 'feature', text: 'Added daily challenges, study goals, and advanced analytics.' },
            { date: '2026-04-12', tag: 'feature', text: 'Added shareable decks, export JSON/CSV, and Microsoft Learn search integration.' },
            { date: '2026-04-12', tag: 'infra', text: 'Added Jest tests, rate limiting, and caching for expensive queries.' },
            { date: '2026-04-10', tag: 'design', text: 'Updated UX with feedback banners, running score, loading timers, keyboard hints, and SVG icons.' },
            { date: '2026-04-09', tag: 'feature', text: 'Initial core launch: AI flash card generation from Microsoft Learn documentation, auth, score tracking, and history.' },
            { date: '2026-04-09', tag: 'infra', text: 'Replaced broken CORS proxy with server-side fetch proxy and improved card navigation.' },
        ];

        const prHistory = [
            'P01: Anonymous-first flow — study without signing in, prompt account creation after first session.',
            'P02: Question quality feedback — flag confusing, wrong, or irrelevant questions.',
            'P03: AI-powered personalized weakness reports using Claude analysis of wrong-answer patterns.',
            'P04: AI-powered certification readiness scoring with Claude assessment.',
            'P05: Socratic Mode — conversational AI coaching with Claude dialogue.',
            'P06: Scenario-based learning — workplace scenarios included in the question mix.',
            'P07: Curated learning paths for AZ-900, AI-900, SC-900, MS-900 certifications.',
            'P08: Session persistence — save and resume interrupted sessions via local storage.',
            'P09: Achievement toast notifications with celebratory animations.',
            'P10: Session summary — question-by-question breakdown on the results page.',
            'P11: User friction telemetry — track hesitation, abandonment, answer timing.',
            'P12: Content quality scoring — warn users when source page content is too shallow.',
            'P13-P22: Adaptive learning, retention tracking, teach-back mode, cross-document synthesis, difficulty calibration, search UI, share/export UI.',
            'P23-P50: Hints, timed mode, keyboard shortcuts, haptic feedback, daily challenges, study goals, leaderboard tiers, knowledge decay, CI/CD, rate limiting, caching.',
        ];

        function render() {
            const container = document.getElementById('changelog-content');
            const features = entries.filter(e => e.tag === 'feature').length;
            const fixes = entries.filter(e => e.tag === 'fix').length;
            const design = entries.filter(e => e.tag === 'design').length;
            const infra = entries.filter(e => e.tag === 'infra').length;
            const docs = entries.filter(e => e.tag === 'docs').length;

            let html = `<div class="changelog-summary">
                <div class="summary-stat"><div class="num">${entries.length}</div><div class="label">Updates</div></div>
                <div class="summary-stat"><div class="num">${features}</div><div class="label">Features</div></div>
                <div class="summary-stat"><div class="num">${design}</div><div class="label">Design</div></div>
                <div class="summary-stat"><div class="num">${fixes}</div><div class="label">Fixes</div></div>
                <div class="summary-stat"><div class="num">${infra}</div><div class="label">Infra</div></div>
                <div class="summary-stat"><div class="num">${docs}</div><div class="label">Docs</div></div>
            </div>`;

            const grouped = {};
            entries.forEach(e => { if (!grouped[e.date]) grouped[e.date] = []; grouped[e.date].push(e); });
            const tagCls = { feature: 'tag-feature', fix: 'tag-fix', design: 'tag-design', infra: 'tag-infra', docs: 'tag-docs' };

            for (const [date, items] of Object.entries(grouped)) {
                const d = new Date(date + 'T12:00:00');
                const fmt = d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                html += `<div class="changelog-date-group"><div class="changelog-date">${fmt}</div>`;
                for (const item of items) {
                    html += `<div class="changelog-entry"><span class="changelog-tag ${tagCls[item.tag] || 'tag-infra'}">${item.tag}</span><div class="changelog-text">${item.text}</div></div>`;
                }
                html += '</div>';
            }

            html += `<section class="pr-history"><div class="changelog-date">Complete PR History</div><ul>${prHistory.map(item => `<li>${item}</li>`).join('')}</ul></section>`;
            container.innerHTML = html;
        }
        render();
    </script>
    <script src="config.js"></script>
    <script src="consent.js"></script>
    <script src="auth.js"></script>
    <script src="nav.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
