<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certifications — Good Better Best</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .paths-container { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
        .back-link { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem; font-weight: 500; font-size: 0.85rem; opacity: 0.8; }
        .back-link:hover { opacity: 1; }

        .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .filter-bar input { flex: 1; min-width: 200px; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text); font-family: inherit; font-size: 0.82rem; outline: none; }
        .filter-bar input:focus { border-color: var(--primary); }
        .filter-bar input::placeholder { color: var(--text-muted); }
        .filter-bar select { padding: 0.5rem 0.6rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text); font-family: inherit; font-size: 0.78rem; appearance: none; cursor: pointer; }

        .cert-count { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem; font-family: var(--font-mono); }

        .cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.6rem; }

        .cert-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; transition: all var(--fast); cursor: pointer; text-decoration: none; display: block; position: relative; overflow: hidden; }
        .cert-card:hover { border-color: rgba(245,197,24,0.25); transform: translateY(-1px); }
        .cert-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--primary-glow), transparent); }

        .cert-name { font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 0.3rem; line-height: 1.4; }
        .cert-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .cert-tag { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.12rem 0.4rem; border-radius: 4px; }
        .tag-area { background: var(--primary-glow); color: var(--primary); }
        .tag-level { background: rgba(52,211,153,0.12); color: var(--success); }
        .tag-level-intermediate { background: rgba(129,140,248,0.12); color: #818cf8; }
        .tag-level-advanced { background: rgba(248,113,113,0.12); color: var(--error); }

        .cert-actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
        .cert-btn { font-size: 0.7rem; padding: 0.3rem 0.6rem; border: 1px solid var(--border); border-radius: var(--radius); background: none; color: var(--text-dim); cursor: pointer; font-family: inherit; transition: all var(--fast); text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem; }
        .cert-btn:hover { border-color: var(--primary); color: var(--primary); }
        .cert-btn-primary { background: var(--primary-dark); color: #000; border-color: var(--primary-dark); font-weight: 600; }
        .cert-btn-primary:hover { background: var(--primary); }

        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }

        /* Study Settings Modal */
        .study-modal {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            padding: 1rem; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .study-modal.visible { opacity: 1; pointer-events: auto; }
        .study-modal.hidden { display: flex; }
        .study-modal-inner {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 1.25rem;
            max-width: 340px; width: 100%;
            transform: translateY(10px) scale(0.97);
            transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
        }
        .study-modal.visible .study-modal-inner { transform: translateY(0) scale(1); }
        .study-modal-inner h3 { font-size: 0.95rem; color: var(--text); margin-bottom: 0.25rem; }
        .study-modal-field { margin-bottom: 0.6rem; }
        .study-modal-field label { display: block; font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.25rem; }
        .study-modal-field select { width: 100%; padding: 0.45rem 0.6rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text); font-family: inherit; font-size: 0.82rem; }
        .study-modal-actions { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.75rem; }
        .btn-full { width: 100%; }

        @media (max-width: 600px) {
            .cert-grid { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; }
            .filter-bar input { min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="paths-container">
        <a href="/" class="back-link">← Back</a>
        <header>
            <h1><i data-lucide="route" style="display:inline;vertical-align:-3px;width:1.2em;height:1.2em;stroke:var(--primary)"></i> Microsoft Certifications</h1>
            <p>Browse all certifications, filter by area and level</p>
        </header>

        <div class="filter-bar">
            <input type="text" id="search" placeholder="Search certifications & applied skills..." autocomplete="off">
            <select id="area-filter"><option value="">All Areas</option></select>
            <select id="level-filter"><option value="">All Levels</option></select>
            <select id="type-filter"><option value="">All Types</option><option value="certification">Certifications</option><option value="applied-skill">Applied Skills</option></select>
        </div>
        <div class="cert-count" id="cert-count"></div>
        <div class="cert-grid" id="cert-grid"></div>

        <!-- Study Settings Modal -->
        <div id="study-modal" class="study-modal hidden">
            <div class="study-modal-inner">
                <h3>Study Settings</h3>
                <p id="study-modal-cert" style="font-size:0.78rem;color:var(--text-dim);margin-bottom:0.75rem;"></p>
                <div class="study-modal-field">
                    <label>Number of Cards</label>
                    <select id="modal-card-count">
                        <option value="3">3 Cards</option>
                        <option value="5" selected>5 Cards</option>
                        <option value="10">10 Cards</option>
                        <option value="15">15 Cards</option>
                        <option value="20">20 Cards</option>
                    </select>
                </div>
                <div class="study-modal-field">
                    <label>Difficulty</label>
                    <select id="modal-difficulty">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate" selected>Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
                <div class="study-modal-field">
                    <label>Timer</label>
                    <select id="modal-timer">
                        <option value="0" selected>No Timer</option>
                        <option value="30">30 seconds</option>
                        <option value="60">60 seconds</option>
                        <option value="90">90 seconds</option>
                    </select>
                </div>
                <div class="study-modal-actions">
                    <button class="btn btn-primary btn-full" id="modal-start">Start Studying</button>
                    <button class="btn btn-secondary btn-full" id="modal-cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="consent.js"></script>
    <script src="auth.js"></script>
    <script>
        const API_BASE = window.__API_BASE__ || '';
        let allCerts = [];

        async function load() {
            try {
                const res = await fetch(`${API_BASE}/api/learning-paths`);
                if (!res.ok) throw new Error(`API returned ${res.status}`);
                const data = await res.json();
                allCerts = data.certifications || [];

                if (!allCerts.length) {
                    document.getElementById('cert-grid').innerHTML = '<div class="empty-state">No certifications loaded. The API may be starting up — try refreshing in a moment.</div>';
                    return;
                }

            // Populate filters
            const areaSelect = document.getElementById('area-filter');
            (data.areas || []).forEach(a => { const o = document.createElement('option'); o.value = a; o.textContent = a; areaSelect.appendChild(o); });

            const levelSelect = document.getElementById('level-filter');
            (data.levels || []).forEach(l => { const s = String(l); const o = document.createElement('option'); o.value = s; o.textContent = s.charAt(0).toUpperCase() + s.slice(1); levelSelect.appendChild(o); });

            render();

            document.getElementById('search').addEventListener('input', render);
            areaSelect.addEventListener('change', render);
            levelSelect.addEventListener('change', render);
            document.getElementById('type-filter').addEventListener('change', render);
            } catch (err) {
                console.error('Failed to load certifications:', err);
                document.getElementById('cert-grid').innerHTML = `<div class="empty-state">Failed to load certifications: ${err.message}</div>`;
            }
        }

        function render() {
            const query = document.getElementById('search').value.toLowerCase();
            const area = document.getElementById('area-filter').value;
            const level = document.getElementById('level-filter').value;
            const type = document.getElementById('type-filter').value;

            const filtered = allCerts.filter(c => {
                if (query && !c.name.toLowerCase().includes(query)) return false;
                if (area && c.area !== area) return false;
                if (level && c.level !== level) return false;
                if (type && c.type !== type) return false;
                return true;
            });

            document.getElementById('cert-count').textContent = `${filtered.length} of ${allCerts.length} certifications`;

            const grid = document.getElementById('cert-grid');
            if (!filtered.length) {
                grid.innerHTML = '<div class="empty-state">No certifications match your filters</div>';
                return;
            }

            grid.innerHTML = filtered.map(c => {
                const levelCls = c.level === 'advanced' ? 'tag-level-advanced' : c.level === 'intermediate' ? 'tag-level-intermediate' : 'tag-level';
                return `
                    <div class="cert-card" data-cert-url="${c.url}">
                        <div class="cert-name">${c.name}</div>
                        <div class="cert-meta">
                            <span class="cert-tag tag-area">${c.area}</span>
                            <span class="cert-tag ${levelCls}">${c.level}</span>
                            <span class="cert-tag" style="background:rgba(148,163,184,0.12);color:var(--text-dim);">${c.type === 'applied-skill' ? 'Applied Skill' : 'Cert'}</span>
                        </div>
                        <div class="cert-actions">
                            <a href="${c.url}" target="_blank" class="cert-btn">Exam Details →</a>
                            <button class="cert-btn cert-btn-primary study-cert-btn" data-url="${c.url}" data-name="${c.name}">Study Skills</button>
                        </div>
                    </div>
                `;
            }).join('');

            // Attach study button handlers
            grid.querySelectorAll('.study-cert-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const url = btn.dataset.url;
                    const name = btn.dataset.name;
                    showStudyModal(url, name);
                });
            });
        }

        load();

        // ── Study Settings Modal ────────────────────────
        let pendingStudyUrl = '';

        function showStudyModal(certUrl, certName) {
            pendingStudyUrl = certUrl;
            document.getElementById('study-modal-cert').textContent = certName;
            const modal = document.getElementById('study-modal');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => modal.classList.add('visible'));
        }

        document.getElementById('modal-cancel')?.addEventListener('click', () => {
            const modal = document.getElementById('study-modal');
            modal.classList.remove('visible');
            setTimeout(() => modal.classList.add('hidden'), 200);
        });

        document.getElementById('modal-start')?.addEventListener('click', async () => {
            const count = document.getElementById('modal-card-count').value;
            const difficulty = document.getElementById('modal-difficulty').value;
            const timer = document.getElementById('modal-timer').value;
            const startBtn = document.getElementById('modal-start');
            startBtn.textContent = 'Loading study guide...';
            startBtn.disabled = true;

            try {
                // Fetch study guide to get training module URLs
                const sgRes = await fetch(`${API_BASE}/api/cert-study-guide?url=${encodeURIComponent(pendingStudyUrl)}`);
                const sg = await sgRes.json();
                let targetUrl = pendingStudyUrl;
                if (sg.trainingUrls && sg.trainingUrls.length > 0) {
                    targetUrl = sg.trainingUrls[Math.floor(Math.random() * Math.min(5, sg.trainingUrls.length))];
                }
                // Navigate with all settings as URL params
                const params = new URLSearchParams({ url: targetUrl, count, difficulty, timer });
                window.location.href = `/?${params.toString()}`;
            } catch {
                const params = new URLSearchParams({ url: pendingStudyUrl, count, difficulty, timer });
                window.location.href = `/?${params.toString()}`;
            }
        });

        // Close modal on backdrop click
        document.getElementById('study-modal')?.addEventListener('click', (e) => {
            if (e.target.id === 'study-modal') {
                e.target.classList.remove('visible');
                setTimeout(() => e.target.classList.add('hidden'), 200);
            }
        });
    </script>
    <script src="nav.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
