<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Paths — Good Better Best</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script><script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .paths-container { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem; }
        .back-link { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem; font-weight: 500; font-size: 0.85rem; opacity: 0.8; }
        .back-link:hover { opacity: 1; }
        .path-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 0.75rem; position: relative; overflow: hidden; }
        .path-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--primary-glow), rgba(245,197,24,0.2), var(--primary-glow), transparent); }
        .path-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
        .path-name { font-size: 0.95rem; font-weight: 700; color: var(--text); }
        .path-badge { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.15rem 0.5rem; border-radius: 4px; background: var(--primary-glow); color: var(--primary); }
        .path-desc { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.75rem; }
        .path-modules { display: flex; flex-direction: column; gap: 0.3rem; }
        .path-module { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.6rem; background: var(--bg-body); border: 1px solid var(--border-subtle); border-radius: var(--radius); cursor: pointer; transition: all var(--fast); text-decoration: none; color: var(--text-dim); font-size: 0.78rem; }
        .path-module:hover { border-color: rgba(245,197,24,0.25); color: var(--text); background: var(--primary-subtle); }
        .path-module-num { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted); width: 18px; flex-shrink: 0; }
        .path-module-title { flex: 1; }
        .path-module-arrow { color: var(--text-muted); font-size: 0.75rem; transition: transform var(--fast); }
        .path-module:hover .path-module-arrow { transform: translateX(2px); color: var(--primary); }
    </style>
</head>
<body>
    <div class="paths-container">
        <a href="/" class="back-link">← Back to Flash Cards</a>
        <header>
            <h1><i data-lucide="route" style="display:inline;vertical-align:-3px;width:1.2em;height:1.2em;stroke:var(--primary)"></i> Learning Paths</h1>
            <p>Structured study paths for Microsoft certifications</p>
        </header>
        <div id="paths-list"></div>
    </div>
    <script src="config.js"></script>
    <script>
        const API_BASE = window.__API_BASE__ || '';
        async function load() {
            const res = await fetch(`${API_BASE}/api/learning-paths`);
            const paths = await res.json();
            document.getElementById('paths-list').innerHTML = paths.map(p => `
                <div class="path-card">
                    <div class="path-header">
                        <span class="path-name">${p.name}</span>
                        <span class="path-badge">${p.difficulty}</span>
                    </div>
                    <div class="path-desc">${p.description}</div>
                    <div class="path-modules">
                        ${p.urls.map((u, i) => `
                            <a href="/?url=${encodeURIComponent(u.url)}" class="path-module">
                                <span class="path-module-num">${i + 1}</span>
                                <span class="path-module-title">${u.title}</span>
                                <span class="path-module-arrow">→</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }
        load();
    </script>
    <script>lucide.createIcons();</script>
    <script src="nav.js"></script>
</body>
</html>
