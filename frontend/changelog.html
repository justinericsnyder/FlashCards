<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog — Good Better Best</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .changelog-container { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem; }
        .back-link { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem; font-weight: 500; font-size: 0.85rem; opacity: 0.8; }
        .back-link:hover { opacity: 1; }
        .changelog-date-group { margin-bottom: 1.5rem; }
        .changelog-date { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border-subtle); font-family: var(--font-mono); }
        .changelog-entry { display: flex; gap: 0.6rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border-subtle); }
        .changelog-entry:last-child { border-bottom: none; }
        .changelog-tag { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.15rem 0.45rem; border-radius: 4px; flex-shrink: 0; height: fit-content; margin-top: 0.15rem; }
        .tag-feature { background: rgba(245,197,24,0.12); color: var(--primary); }
        .tag-fix { background: rgba(52,211,153,0.12); color: var(--success); }
        .tag-design { background: rgba(129,140,248,0.12); color: #818cf8; }
        .tag-infra { background: rgba(148,163,184,0.12); color: var(--text-dim); }
        .changelog-text { font-size: 0.82rem; color: var(--text-dim); line-height: 1.5; }
        .changelog-summary { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; gap: 1.5rem; flex-wrap: wrap; }
        .summary-stat { text-align: center; }
        .summary-stat .num { font-size: 1.25rem; font-weight: 800; color: var(--primary); font-family: var(--font-mono); }
        .summary-stat .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    </style>
</head>
<body>
    <div class="changelog-container">
        <a href="/" class="back-link">← Back</a>
        <header>
            <h1><i data-lucide="file-text" style="display:inline;vertical-align:-3px;width:1.2em;height:1.2em;stroke:var(--primary)"></i> Changelog</h1>
            <p>What's new and improved</p>
        </header>
        <div id="changelog-content"></div>
    </div>
    <script>
        const entries = [
            // ── April 13, 2026 ──────────────────────────
            { date: '2026-04-13', tag: 'fix', text: 'Changelog accessible from desktop nav Data popover' },

            { date: '2026-04-13', tag: 'fix', text: 'Recent topics limited to 5 items' },

            { date: '2026-04-13', tag: 'infra', text: 'Shared theme.js applies saved theme on all pages instantly' },
            { date: '2026-04-13', tag: 'design', text: 'Renamed default theme to "Hoist the Cone"' },
            { date: '2026-04-13', tag: 'feature', text: 'GoPackGo theme: Green Bay Packers-inspired green and gold' },
            { date: '2026-04-13', tag: 'fix', text: 'Achievement toasts only show for newly earned badges, not all' },
            { date: '2026-04-13', tag: 'fix', text: 'Mobile hamburger menu now opens correctly' },
            { date: '2026-04-13', tag: 'design', text: 'Nav revamp: icon-only with hover popovers, grouped items, tooltips — never scrolls' },
            { date: '2026-04-13', tag: 'infra', text: 'Shared nav.js component injected on all pages' },
            { date: '2026-04-13', tag: 'design', text: 'Nav dynamically aligns top and left with first content block on each page' },
            { date: '2026-04-13', tag: 'design', text: 'Two-column layout: main quiz + sidebar for recent topics on desktop' },
            { date: '2026-04-13', tag: 'design', text: 'Rebranded to "Good Better Best" with custom logo and favicon' },
            { date: '2026-04-13', tag: 'feature', text: 'Settings page: 9 color themes, font size toggle, study goals, daily challenge, data export' },
            { date: '2026-04-13', tag: 'feature', text: 'Leaderboard page with Bronze/Silver/Gold/Platinum tiers' },
            { date: '2026-04-13', tag: 'feature', text: 'Explanation text-to-speech button' },
            { date: '2026-04-13', tag: 'feature', text: 'Hint system: eliminate two wrong answers' },
            { date: '2026-04-13', tag: 'feature', text: 'Timed mode: 30/60/90 second timer per card for exam simulation' },
            { date: '2026-04-13', tag: 'feature', text: 'Keyboard shortcuts modal (press ? to view)' },
            { date: '2026-04-13', tag: 'feature', text: 'Haptic feedback on mobile for correct/incorrect answers' },
            { date: '2026-04-13', tag: 'infra', text: 'API rate limiting, server-side response caching, input sanitization' },
            { date: '2026-04-13', tag: 'infra', text: 'CI/CD pipeline with GitHub Actions' },
            { date: '2026-04-13', tag: 'fix', text: 'Robust correct answer resolution for all question types from Claude' },
            { date: '2026-04-13', tag: 'feature', text: 'Adaptive learning: AI adjusts question difficulty based on your performance' },
            { date: '2026-04-13', tag: 'feature', text: 'Learning retention tracking: compare first vs latest attempts' },
            { date: '2026-04-13', tag: 'feature', text: 'Teach-Back Mode: explain concepts in your own words, AI evaluates' },
            { date: '2026-04-13', tag: 'feature', text: 'Cross-document synthesis questions from multiple pages' },
            { date: '2026-04-13', tag: 'feature', text: 'Microsoft Learn search bar on home page' },
            { date: '2026-04-13', tag: 'feature', text: 'Share Deck button with unique shareable links' },
            { date: '2026-04-13', tag: 'feature', text: 'Export study data as JSON or CSV' },
            { date: '2026-04-13', tag: 'feature', text: 'Daily challenges with themed topics and bonus XP' },
            { date: '2026-04-13', tag: 'feature', text: 'Study goals: set and track weekly/monthly session targets' },
            { date: '2026-04-13', tag: 'feature', text: 'Knowledge decay modeling: estimated retention per topic' },
            { date: '2026-04-13', tag: 'fix', text: 'Service worker switched to network-first caching' },

            // ── April 12, 2026 ──────────────────────────
            { date: '2026-04-12', tag: 'feature', text: '29 unlockable achievement badges across 6 categories' },
            { date: '2026-04-12', tag: 'feature', text: 'Profile page: achievements gallery, certification readiness, AI weakness reports' },
            { date: '2026-04-12', tag: 'feature', text: 'Content quality scoring: warns when source page has limited content' },
            { date: '2026-04-12', tag: 'fix', text: 'Learning path links auto-populate URL and start generating' },
            { date: '2026-04-12', tag: 'feature', text: 'User friction telemetry: track hesitation, abandonment, answer timing' },
            { date: '2026-04-12', tag: 'feature', text: 'Session summary: question-by-question breakdown on results page' },
            { date: '2026-04-12', tag: 'feature', text: 'Achievement toast notifications with gold-glow animation' },

            { date: '2026-04-12', tag: 'feature', text: 'Curated learning paths for AZ-900, AI-900, SC-900, MS-900' },
            { date: '2026-04-12', tag: 'feature', text: 'Scenario-based questions: realistic workplace problem-solving' },
            { date: '2026-04-12', tag: 'feature', text: 'Socratic Mode: conversational AI coaching with Claude' },
            { date: '2026-04-12', tag: 'feature', text: 'AI-powered certification readiness score' },
            { date: '2026-04-12', tag: 'feature', text: 'AI-powered personalized weakness reports' },
            { date: '2026-04-12', tag: 'feature', text: 'Question quality feedback: flag confusing or wrong questions' },
            { date: '2026-04-12', tag: 'feature', text: 'Anonymous-first flow: study without signing in' },
            { date: '2026-04-12', tag: 'feature', text: 'Public changelog page' },
            { date: '2026-04-12', tag: 'infra', text: 'Jest test suite: 12 automated tests' },
            { date: '2026-04-12', tag: 'feature', text: 'Microsoft Learn documentation search API' },
            { date: '2026-04-12', tag: 'feature', text: 'Advanced analytics: weekly trends, hardest/strongest topics, activity heatmap' },
            { date: '2026-04-12', tag: 'feature', text: 'Text-to-speech for questions using Web Speech API' },
            { date: '2026-04-12', tag: 'feature', text: 'Shareable decks with unique codes' },
            { date: '2026-04-12', tag: 'feature', text: 'Offline mode with service worker caching' },
            { date: '2026-04-12', tag: 'feature', text: 'Gamification: streaks, XP, achievement badges, leaderboard' },
            { date: '2026-04-12', tag: 'feature', text: 'Multiple question types: true/false, fill-in-the-blank, scenario, multiple choice' },
            { date: '2026-04-12', tag: 'feature', text: 'Spaced repetition with SM-2 algorithm and dedicated review page' },

            // ── April 10, 2026 ──────────────────────────
            { date: '2026-04-10', tag: 'design', text: 'Lucide SVG icons replace all emoji for professional iconography' },
            { date: '2026-04-10', tag: 'design', text: 'UX overhaul: feedback banners, running score, loading timer, keyboard hints' },
            { date: '2026-04-10', tag: 'design', text: 'Design overhaul: noise texture, gold accents, deeper blacks, distinctive cards' },
            { date: '2026-04-10', tag: 'design', text: 'Auth moved to side nav with avatar display' },

            // ── April 9, 2026 ───────────────────────────
            { date: '2026-04-09', tag: 'design', text: 'Pittsburgh black and gold dark theme' },
            { date: '2026-04-09', tag: 'feature', text: 'User authentication: signup, login, JWT sessions, user-scoped data' },
            { date: '2026-04-09', tag: 'feature', text: 'Recent topics quick-access cards on home page' },
            { date: '2026-04-09', tag: 'design', text: 'Chart.js font improvements and filter pills on history page' },
            { date: '2026-04-09', tag: 'fix', text: 'Must answer before proceeding — no skipping questions' },
            { date: '2026-04-09', tag: 'design', text: 'Slide animations replace card flip, floating side nav, mobile bottom bar' },
            { date: '2026-04-09', tag: 'feature', text: 'AI model disclaimer in footer for transparency' },
            { date: '2026-04-09', tag: 'feature', text: 'Compare page: your performance vs all users per topic' },
            { date: '2026-04-09', tag: 'feature', text: 'Smart question deduplication via Claude' },
            { date: '2026-04-09', tag: 'design', text: 'DM Sans + JetBrains Mono fonts' },
            { date: '2026-04-09', tag: 'feature', text: 'Individual question answer logging with per-topic stats' },
            { date: '2026-04-09', tag: 'feature', text: 'Cookie consent banner with granular category controls' },
            { date: '2026-04-09', tag: 'design', text: 'Dark theme with compact layout' },
            { date: '2026-04-09', tag: 'feature', text: 'AI-powered flash card generation using Claude' },
            { date: '2026-04-09', tag: 'feature', text: 'Score tracking and history page with charts' },
            { date: '2026-04-09', tag: 'infra', text: 'Deployed to Vercel (frontend) + Railway (API + PostgreSQL)' },
            { date: '2026-04-09', tag: 'fix', text: 'Replaced dead CORS proxy with server-side fetch, fixed card navigation' },
            { date: '2026-04-09', tag: 'infra', text: 'Initial release: flash card generation from Microsoft Learn documentation' },
        ];

        function render() {
            const container = document.getElementById('changelog-content');
            const features = entries.filter(e => e.tag === 'feature').length;
            const fixes = entries.filter(e => e.tag === 'fix').length;
            const design = entries.filter(e => e.tag === 'design').length;
            const infra = entries.filter(e => e.tag === 'infra').length;

            let html = `<div class="changelog-summary">
                <div class="summary-stat"><div class="num">${entries.length}</div><div class="label">Updates</div></div>
                <div class="summary-stat"><div class="num">${features}</div><div class="label">Features</div></div>
                <div class="summary-stat"><div class="num">${design}</div><div class="label">Design</div></div>
                <div class="summary-stat"><div class="num">${fixes}</div><div class="label">Fixes</div></div>
                <div class="summary-stat"><div class="num">${infra}</div><div class="label">Infra</div></div>
            </div>`;

            const grouped = {};
            entries.forEach(e => { if (!grouped[e.date]) grouped[e.date] = []; grouped[e.date].push(e); });
            const tagCls = { feature: 'tag-feature', fix: 'tag-fix', design: 'tag-design', infra: 'tag-infra' };

            for (const [date, items] of Object.entries(grouped)) {
                const d = new Date(date + 'T12:00:00');
                const fmt = d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                html += `<div class="changelog-date-group"><div class="changelog-date">${fmt}</div>`;
                for (const item of items) {
                    html += `<div class="changelog-entry"><span class="changelog-tag ${tagCls[item.tag] || 'tag-infra'}">${item.tag}</span><div class="changelog-text">${item.text}</div></div>`;
                }
                html += '</div>';
            }
            container.innerHTML = html;
        }
        render();
    </script>
    <script src="config.js"></script>
    <script src="consent.js"></script>
    <script src="auth.js"></script>
    <script src="nav.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
